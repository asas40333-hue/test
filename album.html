<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>2026 히로시마·오카야마 골프여행 특별 앨범</title>

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="[포토북] 2026 히로시마·오카야마 골프여행 특별 앨범">
  <meta property="og:description" content="두 부부의 세 번째 일본 골프여행 · 어디에 닿을까보다 누구와 함께 걷는가">
  <meta property="og:image" content="https://asas40333-hue.github.io/test/album-p1.png">
  <meta property="og:url" content="https://asas40333-hue.github.io/test/album.html">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 1000px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #262626;
      background: #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-tabs {
      display: flex;
      background: #262626;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .mode-tab {
      background: transparent;
      border: none;
      color: #999;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-tab.active {
      background: #c8a97e;
      color: #1a1a1a;
    }

    .tip-banner {
      width: 100%;
      max-width: 1000px;
      background: #28241d;
      color: #dfc49e;
      border-bottom: 1px solid #3d3527;
      padding: 9px 16px;
      font-size: 12.5px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1.4;
    }

    /* SCROLL VIEW */
    .scroll-container {
      width: 100%;
      max-width: 1000px;
      padding: 14px 12px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .scroll-item {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #282828;
      position: relative;
    }
    .scroll-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .page-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: #c8a97e;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* SLIDE VIEW */
    .slide-container {
      width: 100%;
      max-width: 1000px;
      padding: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .slide-frame {
      width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid #282828;
      position: relative;
    }
    .slide-frame img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.2s ease;
    }
    .slide-nav-bar {
      margin-top: 16px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .slide-page-indicator {
      font-size: 13px;
      color: #c8a97e;
      font-weight: 700;
      background: #252525;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #333;
    }

    /* TOOLBAR */
    .toolbar {
      width: 100%;
      max-width: 1000px;
      padding: 14px 16px 28px;
      display: flex;
      justify-content: center;
      gap: 10px;
      border-top: 1px solid #222;
      background: #141414;
      flex-wrap: wrap;
    }
    .btn {
      background: #252525;
      color: #eee;
      border: 1px solid #3a3a3a;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #303030; }
    .btn-gold {
      background: #8b6e47;
      border-color: #a48255;
      color: #fff;
    }
    .btn-gold:hover { background: #a48255; }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🍁 히로시마·오카야마 골프 화보</div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabScroll" onclick="setMode('scroll')">📜 스크롤</button>
      <button class="mode-tab" id="tabSlide" onclick="setMode('slide')">📖 한 장씩</button>
    </div>
  </header>

  <div class="tip-banner">
    <span>💡 <b>가로 회전 안내:</b> 스마트폰을 옆으로(가로로) 돌리시면 사진과 글씨가 화면 가득 시원하게 커집니다!</span>
  </div>

  <!-- SCROLL VIEW -->
  <main class="scroll-container" id="scrollView">
    <div class="scroll-item">
      <img src="album-p1.png" alt="히로시마 골프여행 1쪽 (부부 투샷 및 프롤로그)" loading="eager">
      <div class="page-badge">1 / 4</div>
    </div>
    <div class="scroll-item">
      <img src="album-p2.png" alt="히로시마 골프여행 2쪽 (사모님 티샷 및 6회 스코어)" loading="lazy">
      <div class="page-badge">2 / 4</div>
    </div>
    <div class="scroll-item">
      <img src="album-p3.png" alt="히로시마 골프여행 3쪽 (구라시키 미관지구 및 가마메시 정식)" loading="lazy">
      <div class="page-badge">3 / 4</div>
    </div>
    <div class="scroll-item">
      <img src="album-p4.png" alt="히로시마 골프여행 4쪽 (4컷 요약 및 가고시마 에필로그)" loading="lazy">
      <div class="page-badge">4 / 4</div>
    </div>
  </main>

  <!-- SLIDE VIEW -->
  <main class="slide-container" id="slideView">
    <div class="slide-frame">
      <img id="slideImg" src="album-p1.png" alt="히로시마 골프여행 슬라이드">
    </div>
    <div class="slide-nav-bar">
      <button class="btn" onclick="prevSlide()">◀ 이전 쪽</button>
      <span class="slide-page-indicator" id="slideIndicator">1 / 4</span>
      <button class="btn btn-gold" onclick="nextSlide()">다음 쪽 ▶</button>
    </div>
  </main>

  <footer class="toolbar">
    <button class="btn" onclick="shareKakao()">📲 카톡 공유하기</button>
    <a class="btn" href="album.pdf" download="2026_히로시마_골프여행_특별포토북.pdf" target="_blank">📥 고화질 PDF 열기·저장</a>
  </footer>

  <script>
    const pages = [
      'album-p1.png',
      'album-p2.png',
      'album-p3.png',
      'album-p4.png'
    ];
    let currentSlide = 0;

    const scrollView = document.getElementById('scrollView');
    const slideView = document.getElementById('slideView');
    const tabScroll = document.getElementById('tabScroll');
    const tabSlide = document.getElementById('tabSlide');
    const slideImg = document.getElementById('slideImg');
    const slideIndicator = document.getElementById('slideIndicator');

    function setMode(mode) {
      if (mode === 'scroll') {
        scrollView.style.display = 'flex';
        slideView.style.display = 'none';
        tabScroll.classList.add('active');
        tabSlide.classList.remove('active');
      } else {
        scrollView.style.display = 'none';
        slideView.style.display = 'flex';
        tabSlide.classList.add('active');
        tabScroll.classList.remove('active');
        updateSlide(currentSlide);
      }
    }

    function updateSlide(index) {
      if (index < 0) index = 0;
      if (index >= pages.length) index = pages.length - 1;
      currentSlide = index;

      slideImg.style.opacity = '0.3';
      setTimeout(() => {
        slideImg.src = pages[currentSlide];
        slideImg.style.opacity = '1';
        slideIndicator.innerText = `${currentSlide + 1} / ${pages.length}`;
      }, 120);
    }

    function prevSlide() {
      if (currentSlide > 0) updateSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < pages.length - 1) updateSlide(currentSlide + 1);
    }

    function shareKakao() {
      const shareUrl = window.location.href.split('?')[0];
      if (navigator.share) {
        navigator.share({
          title: '2026 히로시마·오카야마 골프여행 특별 앨범',
          text: '두 부부의 9박 10일 일본 골프여행 포토북 화보집',
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareUrl).then(() => {
          alert('앨범 링크가 복사되었습니다! 카카오톡에 붙여넣기 하세요.');
        });
      }
    }
  </script>
</body>
</html>
