<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2b4f">
<title>메종플러스 · 우리 집 설명서</title>
<style>
  :root{
    --navy:#1d2b4f;
    --navy2:#2c3d6b;
    --gold:#b9863f;
    --gold-soft:#f7efe1;
    --bg:#f7f4ee;
    --card:#fffdf9;
    --line:#e6ddcf;
    --text:#22242a;
    --muted:#6f6a60;
    --ok:#1f7a5a;
    --ok-soft:#e8f4ee;
    --warn:#a8681f;
    --warn-soft:#fbf0dd;
    --radius:16px;
    --shadow:0 3px 14px rgba(29,43,79,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--text);font-size:16px;line-height:1.65;padding-bottom:96px;}

  /* ---------- top bar ---------- */
  .topbar{background:var(--card);border-bottom:2px solid var(--gold-soft);padding:14px 18px 12px;
    position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .brand-mark{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.12em;}
  .brand-title{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.5px;}
  .brand-title span{color:var(--gold);}
  .top-actions{display:flex;gap:6px;flex-shrink:0;}
  .ghost-btn{background:#fff;border:1px solid var(--line);color:var(--navy);font-size:12.5px;font-weight:700;
    padding:8px 11px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  .ghost-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* ---------- site bar ---------- */
  .site-bar{background:#fff;border-bottom:1px solid var(--line);padding:11px 18px;}
  .site-bar .sb-name{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
  .site-bar .sb-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .site-bar select{width:100%;margin-top:8px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:#fff;color:var(--navy);font-weight:700;}

  main{padding:16px 16px 8px;max-width:760px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:14px;}
  .sec-title{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.4px;margin:22px 2px 10px;
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .sec-title .sub{font-size:12.5px;color:var(--muted);font-weight:600;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(135deg,#1d2b4f 0%,#2c3d6b 62%,#3a4a7a 100%);color:#fff;
    border-radius:var(--radius);padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 24px rgba(29,43,79,.18);}
  .hero .kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:#e8c88e;margin-bottom:6px;}
  .hero h1{font-size:23px;font-weight:900;line-height:1.35;letter-spacing:-.7px;margin-bottom:8px;word-break:keep-all;}
  .hero .addr{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.55;}
  .hero .pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;
    font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;}
  .pill.gold{background:#e8c88e;border-color:#e8c88e;color:#3a2a0c;}

  /* ---------- buttons ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;
    border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:-.3px;}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(29,43,79,.2);}
  .btn-gold{background:var(--gold);color:#fff;box-shadow:0 6px 16px rgba(185,134,63,.24);}
  .btn-line{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-sm{min-height:44px;font-size:14.5px;border-radius:11px;width:auto;padding:0 16px;display:inline-flex;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- warranty ---------- */
  .war-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .war{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px;position:relative;overflow:hidden;}
  .war::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);}
  .war .w-label{font-size:12.5px;font-weight:700;color:var(--muted);}
  .war .w-years{font-size:22px;font-weight:900;color:var(--navy);letter-spacing:-.6px;margin:2px 0 4px;}
  .war .w-years small{font-size:13px;font-weight:700;color:var(--muted);}
  .war .w-date{font-size:12.5px;color:var(--text);font-weight:600;line-height:1.45;}
  .war .w-state{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;}
  .w-state.ok{background:var(--ok-soft);color:var(--ok);}
  .w-state.warn{background:var(--warn-soft);color:var(--warn);}
  .note{background:var(--gold-soft);border:1px solid #ecdcbf;border-radius:12px;padding:12px 14px;
    font-size:13.5px;color:#6b4d1d;line-height:1.6;}

  /* ---------- info rows ---------- */
  .rows{display:flex;flex-direction:column;}
  .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:15px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--muted);font-weight:600;flex-shrink:0;}
  .row .v{font-weight:700;text-align:right;word-break:keep-all;}

  /* ---------- materials ---------- */
  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:0 14px;height:50px;margin-bottom:10px;}
  .search-box input{border:none;outline:none;flex:1;font-size:16px;background:transparent;color:var(--text);}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
  .chip{flex-shrink:0;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:700;
    padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .mat{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .sw{width:46px;height:46px;border-radius:11px;flex-shrink:0;border:1px solid rgba(0,0,0,.12);
    display:flex;align-items:center;justify-content:center;font-size:18px;}
  .mat .m-body{flex:1;min-width:0;}
  .mat .m-cat{font-size:11.5px;font-weight:800;color:var(--gold);letter-spacing:.04em;}
  .mat .m-name{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.3px;margin:1px 0 3px;word-break:keep-all;}
  .mat .m-line{font-size:13.5px;color:#4a4d55;line-height:1.55;word-break:keep-all;}
  .mat .m-line b{font-weight:700;color:var(--text);}
  .mat .m-place{margin-top:6px;display:inline-block;background:#f2efe8;color:#5d5647;font-size:12px;font-weight:700;
    padding:3px 9px;border-radius:8px;}
  .del-btn{border:none;background:#fbeceb;color:#a63a2e;font-weight:800;font-size:13px;border-radius:9px;
    padding:8px 10px;align-self:flex-start;cursor:pointer;flex-shrink:0;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;}

  /* ---------- tips ---------- */
  details.tip{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;box-shadow:var(--shadow);}
  details.tip summary{list-style:none;cursor:pointer;padding:15px 16px;font-size:15.5px;font-weight:800;color:var(--navy);
    display:flex;align-items:center;gap:9px;letter-spacing:-.3px;}
  details.tip summary::-webkit-details-marker{display:none;}
  details.tip summary .em{font-size:18px;}
  details.tip summary .arw{margin-left:auto;color:var(--gold);font-weight:900;transition:transform .2s;}
  details.tip[open] summary .arw{transform:rotate(90deg);}
  details.tip .tip-body{padding:0 16px 16px;font-size:14.5px;line-height:1.75;color:#3d4048;word-break:keep-all;}

  /* ---------- care ---------- */
  .ms{position:relative;padding-left:30px;margin-bottom:12px;}
  .ms::before{content:"";position:absolute;left:9px;top:26px;bottom:-12px;width:2px;background:var(--line);}
  .ms:last-child::before{display:none;}
  .ms .dot{position:absolute;left:0;top:14px;width:20px;height:20px;border-radius:50%;background:#fff;
    border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:10px;}
  .ms.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;}
  .ms .ms-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);}
  .ms .ms-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .ms .ms-title{font-size:15.5px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
  .ms .ms-date{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px;}
  .ms .ms-desc{font-size:13.5px;color:#4a4d55;line-height:1.6;margin-top:6px;word-break:keep-all;}
  .tag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.now{background:var(--warn-soft);color:var(--warn);}
  .tag.soon{background:#eef2fb;color:#3a4a7a;}
  .tag.done{background:var(--ok-soft);color:var(--ok);}
  .msg-box{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:13px;
    font-size:14px;line-height:1.7;color:#2c2f36;background:#fff;resize:vertical;word-break:keep-all;}

  /* ---------- AS ---------- */
  .sym-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
  .sym{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px 12px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:88px;justify-content:center;}
  .sym .s-ic{font-size:24px;line-height:1;}
  .sym .s-k{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
  .sym .s-d{font-size:11.5px;color:var(--muted);line-height:1.35;}
  .sym.on{background:var(--navy);border-color:var(--navy);}
  .sym.on .s-k,.sym.on .s-d{color:#fff;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;font-size:16px;background:#fff;color:var(--text);outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);}
  .field textarea{min-height:84px;resize:vertical;line-height:1.6;}
  .req-list{margin-top:6px;}
  .req{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;box-shadow:var(--shadow);}
  .req .r-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .req .r-sym{font-size:15px;font-weight:800;color:var(--navy);}
  .req .r-meta{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55;}
  .req .r-memo{font-size:13.5px;color:#3d4048;margin-top:5px;word-break:keep-all;}
  .st{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;cursor:pointer;border:none;}
  .st.new{background:#fbeceb;color:#a63a2e;}
  .st.ing{background:var(--warn-soft);color:var(--warn);}
  .st.done{background:var(--ok-soft);color:var(--ok);}

  /* ---------- bottom nav ---------- */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,253,249,.97);
    border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);max-width:760px;margin:0 auto;}
  .nav-btn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;cursor:pointer;color:var(--muted);}
  .nav-btn .n-ic{font-size:20px;line-height:1.2;filter:grayscale(.3);}
  .nav-btn .n-lb{font-size:10.5px;font-weight:800;letter-spacing:-.2px;}
  .nav-btn.on{color:var(--navy);}
  .nav-btn.on .n-ic{filter:none;}
  .nav-btn.on .n-lb::after{content:"";display:block;width:14px;height:3px;border-radius:2px;background:var(--gold);margin:2px auto 0;}

  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:90;background:rgba(20,24,36,.45);display:flex;align-items:flex-end;}
  .sheet-wrap.hidden{display:none;}
  .sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
    padding:10px 16px calc(26px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;}
  .sheet-handle{width:44px;height:5px;border-radius:3px;background:#d9d2c5;margin:6px auto 12px;}
  .sheet h2{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:4px;}
  .sheet .s-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
  .site-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:12px 13px;margin-bottom:8px;}
  .site-row .sr-body{flex:1;min-width:0;}
  .site-row .sr-name{font-size:14.5px;font-weight:800;color:var(--navy);}
  .site-row .sr-meta{font-size:12px;color:var(--muted);}
  .site-row.cur{border-color:var(--gold);background:#fffdf5;}
  .mini{font-size:12.5px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--navy);
    border-radius:9px;padding:7px 10px;cursor:pointer;white-space:nowrap;}
  .mini.danger{color:#a63a2e;border-color:#f0d6d3;background:#fdf5f4;}
  .sheet .divider{height:1px;background:var(--line);margin:16px 0;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);background:var(--navy);color:#fff;
    font-size:14px;font-weight:700;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;
    transition:all .25s;z-index:120;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .foot-note{font-size:12.5px;color:var(--muted);line-height:1.65;text-align:center;padding:18px 8px 4px;}

  @media (max-width:360px){
    .war-grid{grid-template-columns:1fr;}
    .sym-grid{grid-template-columns:1fr 1fr;}
    .hero h1{font-size:21px;}
  }
  @media print{
    .bottom-nav,.top-actions,.ghost-btn{display:none;}
    body{padding-bottom:0;background:#fff;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">MAISON PLUS</div>
    <div class="brand-title">우리 집 <span>설명서</span></div>
  </div>
  <div class="top-actions">
    <button class="ghost-btn" id="btnView" data-act="mode-customer" style="display:none">👁 고객용</button>
    <button class="ghost-btn" id="btnMode" data-act="open-manage">⚙️ 관리</button>
  </div>
</header>

<div class="site-bar" id="siteBar"></div>

<main id="view"></main>

<nav class="bottom-nav" id="nav"></nav>

<div class="sheet-wrap hidden" id="sheet" data-act="sheet-bg"></div>

<div class="toast" id="toast"></div>

<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script id="seed-script">window.SEED=null;</script>
<script>
(function(){
"use strict";

/* =========================================================
   유틸
   ========================================================= */
var DAY = 86400000;
var DOW = ['일','월','화','수','목','금','토'];
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function parseDate(s){
  if(!s) return null;
  var p = String(s).split('-').map(Number);
  if(p.length !== 3 || !p[0]) return null;
  var d = new Date(p[0], p[1]-1, p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function today(){
  var d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function addDays(s, n){
  var d = parseDate(s); if(!d) return '';
  d.setDate(d.getDate() + n); return toISO(d);
}
function addMonths(s, n){
  var d = parseDate(s); if(!d) return '';
  var day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if(d.getDate() < day) d.setDate(0);
  return toISO(d);
}
function addYears(s, n){
  var d = parseDate(s); if(!d) return '';
  var day = d.getDate();
  d.setFullYear(d.getFullYear() + n);
  if(d.getDate() < day) d.setDate(0);
  return toISO(d);
}
function fmtDate(s){
  var d = parseDate(s); if(!d) return '-';
  return d.getFullYear() + '.' + pad2(d.getMonth()+1) + '.' + pad2(d.getDate()) + ' (' + DOW[d.getDay()] + ')';
}
function fmtShort(s){
  var d = parseDate(s); if(!d) return '-';
  return d.getFullYear() + '.' + pad2(d.getMonth()+1) + '.' + pad2(d.getDate());
}
function daysFromToday(s){
  var d = parseDate(s); if(!d) return null;
  return Math.round((d.getTime() - today().getTime()) / DAY);
}
function dday(s){
  var n = daysFromToday(s);
  if(n === null) return '';
  if(n > 0) return 'D-' + n;
  if(n === 0) return 'D-DAY';
  return 'D+' + Math.abs(n);
}
function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p||'id') + Math.random().toString(36).slice(2,8); }
function nowStamp(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* =========================================================
   샘플 데이터 (어은동 한빛아파트 129동 1406호)
   ========================================================= */
var MATERIALS_SEED = [
  {cat:'창호·유리', name:'창호 전체 (샷시)', brand:'LX지인 뷰프레임', spec:'거실·안방 베란다 1:2:1 분할, 중방·입구방·주방 2짝, 거실 내창 언밸런스', color:'LX 그레이 화이트', hex:'#e9e7e2', place:'거실·안방·중방·입구방·주방 전체'},
  {cat:'창호·유리', name:'외창 유리', brand:'그린 로이유리', spec:'복층 로이 코팅 (여름 햇빛·겨울 열손실 차단)', color:'그린 (연녹색 반사)', hex:'#cfe0da', place:'거실·안방·주방 발코니 외창, 주방 이중창 외부'},

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function copyFrom(sel){
  var el = document.getElementById(sel);
  if(!el) return;
  var text = el.value !== undefined ? el.value : el.textContent;
  copyText(text);
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('복사했습니다. 문자·카톡에 붙여넣으세요.'); },
      function(){ legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
}
function legacyCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? '복사했습니다. 문자·카톡에 붙여넣으세요.' : '복사가 안 되면 글을 길게 눌러 직접 복사해 주세요.');
  }catch(e){
    toast('복사가 안 되면 글을 길게 눌러 직접 복사해 주세요.');
  }
}
function download(content, filename, type){
  var blob = new Blob([content], {type: type || 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function slug(s){
  return String(s || '현장').replace(/[^0-9A-Za-z가-힣]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || '현장';
}

function warranty(site){
  var start = site.endDate;
  var iEnd = addDays(addYears(start, Number(site.interiorYears) || 1), -1);
  var wEnd = addDays(addYears(start, Number(site.windowYears) || 2), -1);
  return {start:start, interiorEnd:iEnd, windowEnd:wEnd};
}
function warrantyState(endDate, startDate){
  var todayS = toISO(today());
  if(!endDate) return {cls:'warn', label:'확인 필요'};
  if(startDate && todayS < startDate) return {cls:'warn', label:'준공일부터 적용'};
  var n = daysFromToday(endDate);
  if(n === null) return {cls:'warn', label:'확인 필요'};

  if(n <= 90) return {cls:'warn', label:'만료 ' + n + '일 전'};
  return {cls:'ok', label:'무상 보증 중 (D-' + n + ')'};
}
function milestones(site){

     desc:'3년차. 줄눈·실리콘·도어씰 같은 소모성 보수와 부분 리모델링 상담을 드리는 시점입니다.'}
  ];
}
function msState(dateStr){
  var n = daysFromToday(dateStr);
  if(n === null) return {cls:'soon', label:''};
  if(n < 0) return {cls:'done', label:'지남 (' + Math.abs(n) + '일 전)'};
  if(n === 0) return {cls:'now', label:'오늘'};
  if(n <= 30) return {cls:'now', label:'D-' + n};
  return {cls:'soon', label:'D-' + n};
}

/* =========================================================

   ========================================================= */
function signature(site){
  return '- ' + (site.managerTitle || '메종플러스') + ' ' + (site.managerName || '') + ' ' + (site.managerPhone || '');
}
function customerCall(site){
  return site.customerName ? site.customerName + '님' : '고객님';
}
function siteLabel(site){
  return site.title || '우리 집';
}
function waGwa(s){
  var t = String(s || '').trim();
  if(!t) return '와';
  var c = t.charCodeAt(t.length - 1);
  if(c < 0xAC00 || c > 0xD7A3) return '와';
  return ((c - 0xAC00) % 28 === 0) ? '와' : '과';
}
function careMessage(key, site){

      '작은 회사라 ' + who + ' 한 분의 후기가 다음 고객을 만납니다. 짧게 한 줄이라도 남겨 주시면 큰 힘이 됩니다.\n\n' +
      '불편한 점이 있으면 후기보다 먼저 연락 주세요. 바로 가겠습니다.\n\n' + sig;
  }
  if(key === 'm3'){
    return head + '\n' + who + ', ' + where + ' 입주하신 지 3개월이 되었습니다. 새집 생활에 불편한 곳은 없으신지 궁금합니다.\n\n' +
      '문이 뻑뻑하다, 물이 잘 안 빠진다, 줄눈이 어둡다 같은 작은 것도 사진 한 장 보내주시면 바로 확인하겠습니다.\n\n' +
      '실내건축 무상 보증은 ' + w.interiorEnd.replace(/-/g,'.') + '까지, 창호는 ' + w.windowEnd.replace(/-/g,'.') + '까지입니다.\n\n' +

      '점검은 무상이고, 이번에 발견된 하자는 보증 기간 안에 처리해 드립니다. 창호는 ' + w.windowEnd.replace(/-/g,'.') + '까지 보증이 남아 있습니다.\n\n' + sig;

      '3년쯤 되면 욕실 줄눈·실리콘, 문턱 도어씰, 수전 패킹처럼 소모성 부분이 먼저 지칩니다. 이런 부분만 손보면 집이 다시 새것 같아집니다.\n\n' +

    fmtShort(site.startDate) + ' ~ ' + fmtShort(site.endDate) + (stateTxt ? ' · ' + stateTxt : '') + '</div>';

    h += '<select data-act="pick-site">' + DB.sites.map(function(s){

function viewMaterials(site){
  var mats = site.materials || [];
  var cats = ['전체'];
  mats.forEach(function(m){ if(cats.indexOf(m.cat) < 0) cats.push(m.cat); });

  var q = MAT_Q.trim().toLowerCase();
  var list = mats.filter(function(m){
    if(MAT_CAT !== '전체' && m.cat !== MAT_CAT) return false;
    if(!q) return true;
    var blob = [m.name, m.brand, m.spec, m.color, m.place, m.cat].join(' ').toLowerCase();
    return blob.indexOf(q) >= 0;

/* =========================================================
   액션
   ========================================================= */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act === 'sheet-bg'){ if(e.target === el) closeSheet(); return; }

  if(act === 'tab'){
    TAB = el.getAttribute('data-tab');
    AS_RESULT = '';
    render();
    return;
  }
  if(act === 'open-manage'){ openSheet(); return; }
  if(act === 'mode-customer'){
    MODE = 'customer'; saveMode(); AS_RESULT = '';
    if(sheetOpen) closeSheet();
    render(); toast('고객용 화면입니다.');
    return;
  }
  if(act === 'close-sheet'){ closeSheet(); return; }
  if(act === 'mode'){
    MODE = el.getAttribute('data-mode');
    saveMode();
    AS_RESULT = '';
    if(sheetOpen) renderSheet();
    render();
    toast(MODE === 'admin' ? '업체 관리 화면입니다.' : '고객용 화면입니다.');
    return;
  }
  if(act === 'select-site'){
    DB.currentId = el.getAttribute('data-id'); saveDB(); AS_RESULT=''; renderSheet(); render(); return;
  }
  if(act === 'del-site'){
    var id = el.getAttribute('data-id');
    var s = DB.sites.filter(function(x){ return x.id === id; })[0];
    if(!s) return;
    if(!confirm('"' + s.title + '" 현장을 삭제할까요?\n접수 내역도 함께 지워집니다.')) return;
    DB.sites = DB.sites.filter(function(x){ return x.id !== id; });
    DB.requests = DB.requests.filter(function(r){ return r.siteId !== id; });
    if(DB.currentId === id) DB.currentId = DB.sites[0] ? DB.sites[0].id : null;
    saveDB(); renderSheet(); render(); toast('현장을 삭제했습니다.');
    return;
  }
  if(act === 'add-site'){
    var base = currentSite();
    var t = new Date();
    var ns = {
      id: uid('site'), title: '새 현장 ' + (DB.sites.length + 1), address:'', pyeong:'',
      startDate: toISO(t), endDate: addDays(toISO(t), 30),
      managerName: (base && base.managerName) || '김성수',
      managerTitle: (base && base.managerTitle) || '메종플러스 대표',
      managerPhone: (base && base.managerPhone) || '',
      asPhone: (base && base.asPhone) || '',
      customerName:'', customerPhone:'', workScope:'', interiorYears:1, windowYears:2, memo:'',
      materials: []
    };
    DB.sites.push(ns);
    DB.currentId = ns.id;
    MODE = 'admin'; saveMode();
    TAB = 'home';
    saveDB();
    closeSheet(); render(); toast('새 현장을 만들었습니다. 정보를 채워 주세요.');
    return;
  }
  if(act === 'save-customer'){ exportCustomerFile(); return; }
  if(act === 'copy-url'){ copyText(location.href.split('#')[0]); return; }
  if(act === 'export-json'){
    var stamp = toISO(today()).replace(/-/g,'');
    download(JSON.stringify(DB, null, 2), '메종플러스_우리집설명서_백업_' + stamp + '.json', 'application/json');
    toast('백업 파일을 내려받았습니다.');
    return;
  }
  if(act === 'import-json'){ document.getElementById('importFile').click(); return; }
  if(act === 'reset'){
    if(!confirm('샘플 데이터로 초기화할까요?\n지금 입력한 현장과 접수 내역이 모두 지워집니다.')) return;
    DB = freshDB(); saveDB(); AS_RESULT=''; closeSheet(); render(); toast('샘플 데이터로 되돌렸습니다.');
    return;
  }
  if(act === 'mat-cat'){ MAT_CAT = el.getAttribute('data-cat'); render(); return; }
  if(act === 'sym'){ AS_DRAFT.symptom = el.getAttribute('data-k'); AS_RESULT = ''; render(); return; }
  if(act === 'del-mat'){
    var mid = el.getAttribute('data-id');
    var site0 = currentSite();
    if(!site0) return;
    if(!confirm('이 자재를 목록에서 삭제할까요?')) return;
    site0.materials = site0.materials.filter(function(m){ return m.id !== mid; });
    saveDB(); render(); toast('자재를 삭제했습니다.');
    return;
  }
  if(act === 'add-mat'){ addMaterial(); return; }
  if(act === 'submit-as'){ submitAS(); return; }
  if(act === 'cycle'){
    var rid = el.getAttribute('data-id');
    var r = DB.requests.filter(function(x){ return x.id === rid; })[0];
    if(!r) return;
    r.status = r.status === '접수' ? '확인중' : (r.status === '확인중' ? '완료' : '접수');
    saveDB(); render(); return;
  }
  if(act === 'del-req'){
    var did = el.getAttribute('data-id');
    if(!confirm('이 접수 내역을 삭제할까요?')) return;
    DB.requests = DB.requests.filter(function(x){ return x.id !== did; });
    saveDB(); render(); toast('삭제했습니다.');
    return;
  }
  if(act === 'copy'){ copyFrom(el.getAttribute('data-src')); return; }
  if(act === 'copy-req'){
    var cid = el.getAttribute('data-id');
    var cr = DB.requests.filter(function(x){ return x.id === cid; })[0];
    if(cr) copyText(asMessage(cr, currentSite()));
    return;
  }
  if(act === 'sms'){
    var src = document.getElementById(el.getAttribute('data-src'));
    if(!src) return;
    var cs = currentSite();
    var body = encodeURIComponent(src.value);
    var to = ((cs && cs.asPhone) || '').replace(/[^0-9]/g,'');
    location.href = 'sms:' + to + '?body=' + body;
    return;
  }
  if(act === 'toggle-msg'){
    var wid = el.getAttribute('data-msg') + '-wrap';
    var w = document.getElementById(wid);
    if(w) w.style.display = (w.style.display === 'none' ? 'block' : 'none');
    return;
  }
});

/* 입력 */
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute('data-field')){
    var site = currentSite();
    if(!site) return;
    var key = t.getAttribute('data-field');
    if(key === 'interiorYears' || key === 'windowYears'){
      site[key] = Number(t.value) || 0;
    } else {
      site[key] = t.value;
      if(key === 'startDate' || key === 'endDate') renderSiteBar();
    }
    saveDB();
    return;
  }
  if(t.getAttribute && t.getAttribute('data-draft')){
    AS_DRAFT[t.getAttribute('data-draft')] = t.value;
    return;
  }
  if(t.id === 'matQ'){
    MAT_Q = t.value;
    var s2 = currentSite();
    if(s2) applyMatFilter(s2);
    return;
  }
  if(t.id === 'newName' || t.id === 'newBrand' || t.id === 'newSpec' || t.id === 'newColor' || t.id === 'newPlace'){
    ADD_DRAFT[t.id.replace('new','').toLowerCase()] = t.value;
    return;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t && t.id === 'newCat'){ ADD_DRAFT.cat = t.value; return; }
  if(t && t.id === 'importFile'){
    var f = t.files && t.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(String(reader.result));
        if(!d || !d.sites || !d.sites.length) throw new Error('형식 오류');
        if(!confirm('불러온 자료로 바꿀까요?\n지금 이 기기에 저장된 현장·접수 내역이 교체됩니다. (백업을 먼저 받아 두시면 안전합니다)')) return;
        DB = d;
        DB.requests = DB.requests || [];
        if(!DB.currentId || !DB.sites.some(function(x){return x.id === DB.currentId;})) DB.currentId = DB.sites[0].id;
        saveDB(); MAT_CAT='전체'; MAT_Q=''; closeSheet(); render(); toast('백업을 불러왔습니다.');
      }catch(err){
        toast('파일을 읽지 못했습니다. 백업 JSON 파일인지 확인해 주세요.');
      }
    };
    reader.readAsText(f);
    t.value = '';
  }
});

function applyMatFilter(site){
  var v = document.getElementById('view');
  if(!v || TAB !== 'materials') return;
  var cards = Array.prototype.slice.call(v.querySelectorAll('.mat'));
  var q = MAT_Q.trim().toLowerCase();
  var shown = 0;
  cards.forEach(function(card){
    var ok = (MAT_CAT === '전체' || card.getAttribute('data-cat') === MAT_CAT);
    if(ok && q){
      ok = (card.getAttribute('data-blob') || '').indexOf(q) >= 0;
    }
    card.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  var cnt = document.getElementById('matCount');
  if(cnt) cnt.textContent = shown + '개 표시';
  var emp = document.getElementById('matEmpty');
  if(emp) emp.style.display = shown ? 'none' : '';
}

function addMaterial(){
  var site = currentSite();
  if(!site) return;
  var name = (ADD_DRAFT.name || '').trim();
  if(!name){ toast('자재명을 입력해 주세요.'); return; }
  site.materials.push({
    id: uid('m'), cat: ADD_DRAFT.cat || CATS[0], name: name,
    brand: (ADD_DRAFT.brand || '').trim(), spec: (ADD_DRAFT.spec || '').trim(),
    color: (ADD_DRAFT.color || '').trim(), hex:'#e4ded2', place: (ADD_DRAFT.place || '').trim()
  });
  ADD_DRAFT = {cat: ADD_DRAFT.cat, name:'', brand:'', spec:'', color:'', place:''};
  saveDB(); render(); toast('자재를 추가했습니다.');
}

function submitAS(){
  var site = currentSite();
  if(!site) return;
  if(!AS_DRAFT.symptom){ toast('어떤 증상인지 먼저 골라 주세요.'); return; }
  var contact = (AS_DRAFT.contact || '').trim();
  if(contact.replace(/[^0-9]/g,'').length < 8){ toast('연락처를 정확히 입력해 주세요.'); return; }
  var req = {
    id: uid('r'), siteId: site.id, symptom: AS_DRAFT.symptom,
    location: (AS_DRAFT.location || '').trim(), memo: (AS_DRAFT.memo || '').trim(),
    contact: contact, createdAt: nowStamp(), status: '접수'
  };
  DB.requests.push(req);
  saveDB();
  AS_RESULT = asMessage(req, site);
  AS_DRAFT = {symptom:'', location:'', memo:'', contact:''};
  render();
  toast('접수 문구가 만들어졌습니다. 복사해서 보내 주세요.');
  var box = document.getElementById('msg-as');
  if(box && box.scrollIntoView) box.scrollIntoView({behavior:'smooth', block:'center'});
}

/* =========================================================
   고객용 파일 저장
   ========================================================= */
function exportCustomerFile(){
  var site = currentSite();
  if(!site) return;
  try{
    var clone = document.documentElement.cloneNode(true);
    var view = clone.querySelector('#view');
    if(view) view.innerHTML = '';
    var sheet = clone.querySelector('#sheet');
    if(sheet){ sheet.className = 'sheet-wrap hidden'; sheet.innerHTML = ''; }
    var nav = clone.querySelector('#nav');
    if(nav) nav.innerHTML = '';
    var bar = clone.querySelector('#siteBar');
    if(bar) bar.innerHTML = '';
    var tst = clone.querySelector('#toast');
    if(tst){ tst.className = 'toast'; tst.textContent = ''; }
    var inp = clone.querySelector('#importFile');
    if(inp && inp.parentNode) inp.parentNode.removeChild(inp);
    var seed = clone.querySelector('#seed-script');
    if(!seed) throw new Error('seed missing');
    var payload = {mode:'customer', site: site, requests: requestsOf(site.id)};
    seed.textContent = 'window.SEED=' + JSON.stringify(payload).replace(/</g,'\\u003c') + ';';
    var html = '<!DOCTYPE html>\n' + clone.outerHTML;
    download(html, '우리집설명서_' + slug(site.title) + '.html', 'text/html');
    toast('고객용 파일을 저장했습니다. 카톡·문자로 보내 주세요.');
  }catch(err){
    toast('파일 저장에 실패했습니다. 백업 JSON을 대신 이용해 주세요.');
  }
}

/* =========================================================
   시작
   ========================================================= */
function boot(){
  if(window.SEED && window.SEED.site){
    window.__CUSTOMER_FILE__ = true;
    DB = {version:1, currentId: window.SEED.site.id, sites:[window.SEED.site], requests: window.SEED.requests || []};
    MODE = 'customer';
  } else {
    DB = loadDB();
    var savedMode = null;
    try{ savedMode = localStorage.getItem(MODE_KEY); }catch(e){}
    MODE = savedMode === 'admin' ? 'admin' : 'customer';
    saveDB();
  }
  if(!currentSite()){
    DB = freshDB();
    saveDB();
  }
  render();
}
boot();
})();
</script>
</body>
</html>
