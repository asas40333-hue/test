<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16395B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>온기 코치 · 매일 15분 AI 실습</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --navy:#16395B; --navy-deep:#0C2740; --navy-soft:#255083;
    --emerald:#0E9F6E; --emerald-deep:#0B7D57; --emerald-soft:#E8F6F0;
    --orange:#EF7A22; --orange-deep:#C85F12; --orange-soft:#FDF0E4;
    --bg:#FBF6F0; --card:#FFFFFF; --line:#E9E1D6;
    --ink:#152235; --ink-2:#4B5B71; --ink-3:#8B98A9;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.6;color:var(--ink);background:var(--bg);
    max-width:430px;margin:0 auto;padding-bottom:92px;overflow-x:hidden;
    word-break:keep-all;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  h1,h2,h3,h4{letter-spacing:-.6px;line-height:1.3}
  .hidden{display:none !important}

  /* ── 상단 헤더 ── */
  header.app-head{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(135deg,#16395B 0%,#0C2740 100%);
    color:#fff;padding:12px 16px 13px;
    display:flex;align-items:center;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .brand-logo{
    width:40px;height:40px;flex:none;border-radius:13px;
    background:linear-gradient(135deg,#14B383,#0B7D57);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:800;color:#fff;
    box-shadow:0 4px 12px rgba(14,159,110,.35);
  }
  .brand-title{font-size:19px;font-weight:800;letter-spacing:-.7px;line-height:1.2}
  .brand-sub{font-size:12.5px;font-weight:600;color:#AFC4D8;letter-spacing:-.2px;margin-top:2px}
  .streak-chip{
    flex:none;display:flex;align-items:center;gap:4px;
    background:rgba(239,122,34,.18);border:1px solid rgba(239,122,34,.55);
    color:#FFC48F;font-size:13px;font-weight:800;padding:6px 11px;border-radius:20px;
    letter-spacing:-.2px;
  }

  main{padding:14px 14px 0}
  .view{display:none}
  .view.on{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 3px rgba(21,34,53,.05);padding:16px;margin-bottom:12px;
  }
  .card-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .card-title .em{font-size:18px}
  .muted{color:var(--ink-2);font-size:15.5px}

  /* ── 버튼 ── */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:58px;border-radius:16px;
    font-size:18px;font-weight:800;letter-spacing:-.4px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn-primary{
    background:linear-gradient(135deg,#14B383 0%,#0B7D57 100%);color:#fff;
    box-shadow:0 6px 16px rgba(14,159,110,.28);
  }
  .btn-navy{
    background:linear-gradient(135deg,#1D4670 0%,#102E4B 100%);color:#fff;
    box-shadow:0 6px 16px rgba(22,57,91,.24);
  }
  .btn-orange{background:linear-gradient(135deg,#F58A35,#DE6B14);color:#fff;box-shadow:0 6px 16px rgba(239,122,34,.28)}
  .btn-line{background:#fff;border:2px solid var(--line);color:var(--navy);font-weight:800}
  .btn-line-emerald{background:#fff;border:2px solid var(--emerald);color:var(--emerald-deep)}
  .btn-sm{min-height:48px;font-size:16px;border-radius:13px;padding:0 14px;width:auto}
  .btn:disabled{opacity:.45;box-shadow:none}

  /* ── 하단 탭 ── */
  nav.tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;z-index:50;
    background:rgba(255,255,255,.98);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  }
  .tab{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px;border-radius:12px;color:var(--ink-3);
    font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  }
  .tab .ico{font-size:22px;line-height:1;filter:grayscale(1);opacity:.65;transition:.15s}
  .tab.on{color:var(--navy)}
  .tab.on .ico{filter:none;opacity:1;transform:translateY(-1px)}
  .tab.on .lbl{position:relative}
  .tab.on .lbl:after{
    content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    width:16px;height:3px;border-radius:3px;background:var(--emerald);
  }

  /* ── 온보딩 ── */
  #view-onboard{padding-bottom:30px}
  .onb-top{padding:6px 2px 16px}
  .onb-step-label{font-size:13.5px;font-weight:800;color:var(--emerald-deep);letter-spacing:-.2px}
  .onb-dots{display:flex;gap:6px;margin-top:9px}
  .onb-dots i{height:6px;flex:1;border-radius:4px;background:#E4DED4}
  .onb-dots i.on{background:var(--emerald)}
  .onb-q{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.32;margin:14px 0 6px}
  .onb-sub{font-size:15.5px;color:var(--ink-2);margin-bottom:16px;line-height:1.55}

  .opt{
    display:flex;align-items:center;gap:12px;width:100%;
    min-height:70px;padding:14px 14px;margin-bottom:10px;
    background:#fff;border:2px solid var(--line);border-radius:16px;
    text-align:left;transition:.15s;
  }
  .opt .opt-ico{font-size:27px;flex:none;width:34px;text-align:center}
  .opt .opt-tx{flex:1;min-width:0}
  .opt .opt-label{display:block;font-size:17.5px;font-weight:800;letter-spacing:-.5px}
  .opt .opt-sub{display:block;font-size:14px;color:var(--ink-3);font-weight:600;margin-top:2px;letter-spacing:-.2px}
  .opt .opt-mark{
    width:26px;height:26px;flex:none;border-radius:50%;border:2px solid #D4DCE6;
    display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;font-weight:800;
  }
  .opt.sel{border-color:var(--emerald);background:var(--emerald-soft);box-shadow:0 4px 14px rgba(14,159,110,.12)}
  .opt.sel .opt-mark{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .opt:active{transform:scale(.99)}

  .onb-summary{background:#fff;border:2px solid var(--emerald);border-radius:18px;padding:16px;margin:6px 0 14px}
  .sum-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .sum-row:last-child{border-bottom:0}
  .sum-k{font-size:14px;font-weight:800;color:var(--ink-3);width:78px;flex:none;padding-top:2px}
  .sum-v{font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.45}
  .onb-mission{
    background:linear-gradient(135deg,#FFF7EE,#FDF0E4);border:1px solid #F6DCC0;
    border-radius:14px;padding:13px 14px;margin-top:12px;
  }
  .onb-mission .k{font-size:13px;font-weight:800;color:var(--orange-deep);letter-spacing:-.2px}
  .onb-mission .v{font-size:17px;font-weight:800;letter-spacing:-.5px;margin-top:3px;line-height:1.4}
  .onb-mission .m{font-size:14px;color:var(--ink-2);margin-top:4px;font-weight:600}

  /* ── 실습 탭 ── */
  .mission-hero{
    background:linear-gradient(135deg,#1D4670 0%,#102E4B 100%);
    color:#fff;border-radius:20px;padding:18px 17px 17px;margin-bottom:13px;
    box-shadow:0 8px 22px rgba(16,46,75,.22);position:relative;overflow:hidden;
  }
  .mission-hero:after{
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;background:rgba(20,179,131,.18);
  }
  .mh-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#8FE3C6;letter-spacing:-.2px}
  .mh-day{background:rgba(20,179,131,.22);border:1px solid rgba(20,179,131,.5);padding:3px 9px;border-radius:20px;color:#9BEFD2}
  .mh-title{font-size:23px;font-weight:800;letter-spacing:-1px;line-height:1.32;margin:9px 0 10px;position:relative;z-index:1}
  .mh-chips{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
  .chip{font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.13);color:#DCE8F3;letter-spacing:-.2px}
  .chip.em{background:rgba(20,179,131,.24);color:#A6F0D6}
  .mh-bar{position:relative;z-index:1;margin-top:14px}
  .bar-track{height:11px;border-radius:8px;background:rgba(255,255,255,.16);overflow:hidden}
  .bar-fill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#31C99A,#8BE9C8);transition:width .45s cubic-bezier(.2,.9,.3,1)}
  .mh-bar-tx{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#B8CBDD;margin-top:6px;letter-spacing:-.2px}

  .step{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;transition:.18s}
  .step.done{border-color:#A7E2CB;background:linear-gradient(180deg,#F4FCF8 0%,#fff 70%)}
  .step-head{display:flex;gap:11px;align-items:flex-start;width:100%;padding:15px 15px 10px;text-align:left}
  .check{
    width:30px;height:30px;flex:none;border-radius:50%;border:2px solid #CBD5E1;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;color:transparent;background:#fff;transition:.15s;
  }
  .step.done .check{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .step-kicker{font-size:13px;font-weight:800;color:var(--emerald-deep);letter-spacing:-.2px}
  .step-title{font-size:18px;font-weight:800;letter-spacing:-.55px;line-height:1.38;margin-top:1px}
  .step-body{padding:0 15px 16px}
  .step-desc-lg{font-size:18px;font-weight:700;color:var(--ink);line-height:1.62;letter-spacing:-.35px}
  .step-reopen{font-size:13px;font-weight:800;color:#9AA8B8;flex:none;align-self:center}
  .step-close{min-height:44px;font-size:14.5px;border-radius:11px}
  .feat-label{font-size:15px;font-weight:800;color:var(--ink-2);margin:13px 0 7px;letter-spacing:-.3px}
  .feat-wrap{display:flex;flex-wrap:wrap;gap:7px}
  .feat{
    min-height:46px;padding:9px 13px;border-radius:12px;border:2px solid var(--line);
    background:#fff;font-size:15.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.3px;
  }
  .feat.sel{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald-deep)}
  .gen-note{
    display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;
    border-radius:16px;background:var(--emerald-soft);border:1.5px solid #BFE6D6;
    color:var(--emerald-deep);font-size:17px;font-weight:800;letter-spacing:-.3px;
  }
  .gen-note .dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emerald);margin:0 2px;animation:blink 1s infinite}
  .gen-note .dots i:nth-child(2){animation-delay:.2s}
  .gen-note .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .big-make{font-size:19px;min-height:64px}
  .step.done .step-title{color:var(--emerald-deep)}
  .tip{
    display:flex;gap:7px;margin-top:10px;padding:10px 12px;border-radius:12px;
    background:#F7F4EF;color:#6B5A44;font-size:14.5px;line-height:1.55;font-weight:600;letter-spacing:-.2px;
  }
  .prompt-box{
    margin-top:11px;background:#F5F1EA;border:1.5px dashed #D8CDBE;border-radius:13px;
    padding:12px;font-size:15px;line-height:1.62;color:#3F4C5E;
    white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;letter-spacing:-.2px;
  }
  .prompt-actions{display:flex;gap:8px;margin-top:10px}
  .prompt-actions .btn{min-height:50px;font-size:16px;border-radius:13px}

  .field-label{font-size:15px;font-weight:800;margin:14px 0 7px;letter-spacing:-.3px}
  .input{
    width:100%;min-height:60px;border:2px solid var(--line);border-radius:15px;
    padding:13px 14px;font-size:18px;font-weight:700;color:var(--ink);background:#fff;
    letter-spacing:-.3px;
  }
  .input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 4px rgba(14,159,110,.12)}
  .input::placeholder{color:#A9B4C4;font-weight:500}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .result{
    background:linear-gradient(180deg,#FFFDF8,#fff);border:2px solid #F2C79B;
    border-radius:18px;padding:0;overflow:hidden;margin-top:13px;animation:pop .28s ease;
  }
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .result-head{
    display:flex;align-items:center;gap:8px;padding:13px 15px;
    background:linear-gradient(135deg,#F59B4B,#E2731A);color:#fff;
  }
  .result-head .rt{font-size:16.5px;font-weight:800;letter-spacing:-.4px;flex:1}
  .result-head .rk{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:7px;flex:none}
  .result-body{padding:15px;font-size:16.5px;line-height:1.72;white-space:pre-wrap;word-break:break-word;letter-spacing:-.3px}
  .result-foot{padding:0 15px 15px}
  .result-tip{font-size:14.5px;color:#6B5A44;background:#FBF3E8;border-radius:12px;padding:10px 12px;line-height:1.55;font-weight:600;margin-bottom:11px}
  .res-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .done-banner{
    background:linear-gradient(135deg,#E8F6F0,#F4FCF8);border:2px solid #A7E2CB;
    border-radius:18px;padding:16px;margin:13px 0;text-align:center;animation:pop .3s ease;
  }
  .done-banner .db-emoji{font-size:34px;line-height:1}
  .done-banner h3{font-size:19px;font-weight:800;color:var(--emerald-deep);margin:7px 0 4px;letter-spacing:-.6px}
  .done-banner p{font-size:14.5px;color:var(--ink-2);font-weight:600;line-height:1.5}

  .course-list{margin-top:4px}
  .course-row{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
  .course-row:last-child{border-bottom:0}
  .cr-day{
    width:44px;height:44px;flex:none;border-radius:12px;background:#F3EEE7;color:var(--ink-3);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;line-height:1.1;
  }
  .cr-day b{font-size:15px}
  .course-row.now .cr-day{background:var(--navy);color:#fff}
  .course-row.done .cr-day{background:var(--emerald);color:#fff}
  .cr-tx{flex:1;min-width:0}
  .cr-title{font-size:15.5px;font-weight:800;letter-spacing:-.35px;line-height:1.4}
  .cr-meta{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-top:2px}
  .cr-tag{font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:6px;flex:none;background:#F3EEE7;color:var(--ink-3)}
  .course-row.done .cr-tag{background:var(--emerald-soft);color:var(--emerald-deep)}

  /* ── 도와줘 탭 ── */
  .help-note{
    background:#FFF8EC;border:1px solid #F5D9B4;border-radius:14px;padding:12px 13px;
    font-size:14.5px;color:#7A5B33;line-height:1.55;font-weight:600;margin-bottom:12px;letter-spacing:-.2px;
  }
  .situ{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    min-height:66px;padding:13px 13px;margin-bottom:9px;background:#fff;
    border:2px solid var(--line);border-radius:15px;transition:.15s;
  }
  .situ .si-ico{font-size:24px;flex:none;width:32px;text-align:center}
  .situ .si-tx{flex:1;font-size:16.5px;font-weight:700;line-height:1.4;letter-spacing:-.4px;min-width:0}
  .situ .si-arrow{color:#C1CBD8;font-size:19px;font-weight:800;flex:none}
  .situ:active{transform:scale(.99);border-color:var(--emerald)}
  .situ.sel{border-color:var(--emerald);background:var(--emerald-soft)}

  .ask-box{margin-top:12px}
  .ask-row{display:flex;gap:8px;margin-top:9px}
  .ask-row .btn{min-height:56px;border-radius:14px;font-size:16.5px}
  .ask-input{
    width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;
    padding:12px 14px;font-size:16.5px;font-weight:600;background:#fff;letter-spacing:-.3px;
  }
  .ask-input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 4px rgba(14,159,110,.12)}

  .answer{border:2px solid #BFE6D6;border-radius:18px;background:#fff;padding:0;overflow:hidden;margin-top:13px;animation:pop .25s ease}
  .answer-head{display:flex;align-items:center;gap:9px;padding:13px 15px;background:linear-gradient(135deg,#12835C,#0B7D57);color:#fff}
  .answer-head .ah-ico{font-size:20px}
  .answer-head .ah-tx{flex:1;min-width:0}
  .answer-head .ah-q{font-size:12.5px;font-weight:700;color:#B6EEDB;letter-spacing:-.2px}
  .answer-head .ah-k{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
  .answer-body{padding:15px}
  .a-step{display:flex;gap:11px;padding:9px 0}
  .a-num{
    width:29px;height:29px;flex:none;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;margin-top:1px;
  }
  .a-tx{font-size:16px;line-height:1.65;color:#2B3A4E;letter-spacing:-.3px}
  .a-one{
    margin-top:10px;padding:12px 13px;border-radius:13px;background:var(--emerald-soft);
    border:1px solid #BFE6D6;font-size:15px;font-weight:700;color:#0A6346;line-height:1.6;letter-spacing:-.2px;
  }
  .a-foot{display:flex;gap:8px;padding:0 15px 15px}
  .a-foot .btn{min-height:50px;font-size:15.5px;border-radius:13px}

  /* ── 내 결과물 ── */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
  .stat .sv{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.2;color:var(--navy)}
  .stat .sv.em{color:var(--emerald-deep)}
  .stat .sv.or{color:var(--orange-deep)}
  .stat .sk{font-size:12.5px;font-weight:800;color:var(--ink-3);margin-top:3px;letter-spacing:-.3px}

  .cal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .cal-cell{
    aspect-ratio:1/1;border-radius:11px;background:#F4F0E9;border:1.5px solid #EDE7DD;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#AEB8C4;position:relative;letter-spacing:-.3px;
  }
  .cal-cell b{font-size:15px;line-height:1}
  .cal-cell small{font-size:9px;font-weight:800;color:#B9C2CD;margin-top:2px}
  .cal-cell.done{background:var(--emerald);border-color:var(--emerald);color:#fff}
  .cal-cell.done small{color:#C9F3E2}
  .cal-cell.now{background:#fff;border:2px dashed var(--orange);color:var(--orange-deep)}
  .cal-cell.now small{color:var(--orange)}
  .cal-legend{display:flex;gap:14px;margin-top:11px;font-size:13px;color:var(--ink-3);font-weight:700}
  .cal-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o === 'object'){
        return { profile:o.profile||null, records:Array.isArray(o.records)?o.records:[], startedAt:o.startedAt||null };
      }
    }
  }catch(e){}
  return { profile:null, records:[], startedAt:null };
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function todayStr(){
  try{
    return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  }catch(e){
    const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
}
function shiftDate(s,delta){
  const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+delta); return d.toISOString().slice(0,10);
}
function fmtDate(s){
  const p=s.split('-'); return p[1].replace(/^0/,'')+'월 '+p[2].replace(/^0/,'')+'일';
}
function doneDates(){ return [...new Set(S.records.map(r=>r.date))].sort(); }
function streak(){
  const ds=doneDates(); if(!ds.length) return 0;
  const t=todayStr();
  let cur;
  if(ds.includes(t)) cur=t;
  else if(ds.includes(shiftDate(t,-1))) cur=shiftDate(t,-1);
  else return 0;
  let n=0;
  while(ds.includes(cur)){ n++; cur=shiftDate(cur,-1); }
  return n;
}
function nextDayNo(){ return S.records.length ? Math.max(...S.records.map(r=>r.day||0)) + 1 : 1; }

let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2000);
}
async function copyText(text, okMsg){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else throw new Error('no clipboard');
    toast(okMsg||'복사했어요. 붙여넣어 보세요');
  }catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast(okMsg||'복사했어요. 붙여넣어 보세요');
    }catch(e2){ toast('복사가 안 되면 화면을 길게 눌러 직접 선택해 주세요'); }
  }
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('이 휴대폰에서는 읽어주기가 어렵습니다'); return; }
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=0.92; u.pitch=1.0;
    window.speechSynthesis.speak(u);
    toast('읽어 드리고 있어요');
  }catch(e){ toast('읽어주기를 쓸 수 없습니다'); }
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  const ni=document.getElementById('nameInput');
  if(!name){
    toast('이름을 먼저 넣어 주세요');
    if(ni){ ni.classList.add('shake'); setTimeout(()=>ni.classList.remove('shake'),340); ni.focus(); }
    return;
  }
  pr.generating=true;
  pr.openStep=2;
  renderPractice();
  // 잠깐 생성하는 느낌(0.6초) 뒤에 이 화면 안에서 바로 결과가 나온다
  setTimeout(()=>{
    const p=S.profile;
    const o=OUT[p.field][p.goal](name);
    if(pr.feature){
      o.lines=o.lines.slice();
      o.lines.splice(o.lines[0].trim()?1:0,0,'· '+pr.feature);
    }
    pr.output=o;
    pr.generating=false;
    pr.stepDone[2]=true;
    pr.openStep=-1;
    pr.completed=pr.stepDone.every(Boolean);
    if(pr.completed) saveCompletion(o,name);
    renderPractice();
    setTimeout(()=>{
      const rc=document.getElementById('resultCard');
      if(rc) rc.scrollIntoView({behavior:'smooth',block:'center'});
    },80);
    toast(pr.completed?'결과물이 완성됐어요!':'결과물이 나왔습니다');
  },600);
}
function saveCompletion(o,name){
  const t=todayStr();
  const sameDay=S.records.filter(r=>r.date===t);
  const base={ date:t, title:o.title, field:S.profile.field, goal:S.profile.goal,
    level:S.profile.level, name:name, lines:o.lines, at:Date.now() };
  // 같은 날 여러 번 완주해도 앞서 만든 결과물은 지우지 않고 함께 보관한다
  S.records.push(Object.assign({ day: sameDay.length ? sameDay[0].day : nextDayNo() }, base));
  saveState();
  updateStreakChip();
}

function answerHTML(a){
  return `
    <div class="answer">
      <div class="answer-head">
        <span class="ah-ico">🧑‍🏫</span>
        <span class="ah-tx">
          <span class="ah-q">${esc(a.q)}</span>

      </div>

function bindAnswerButtons(){
  const rd=document.getElementById('readAnswer');
  if(rd) rd.addEventListener('click',()=>{
    if(!helpAns) return;
    speak(helpAns.steps.map((s,i)=>(i+1)+'번째. '+s).join(' '));
  });
  const ag=document.getElementById('askAgain');
  if(ag) ag.addEventListener('click',()=>{
    helpAns=null; renderHelp();
    const i=document.getElementById('askInput'); if(i) i.focus();
  });
}
function askQuestion(){
  const q=(helpQ||'').trim();
  if(!q){ toast('궁금한 것을 먼저 적어 주세요'); return; }
  const low=q.toLowerCase();
  let found=HELP_TOPICS.find(t=>t.keys.some(k=>low.includes(k)));
  let hitPreset=HELP_PRESETS.find(h=>h.label.includes(q)||q.includes(h.label.slice(0,6)));
  if(!hitPreset){
    if(/아이콘|홈 ?화면/.test(q)) hitPreset=HELP_PRESETS[0];
    else if(/누워|돌아|회전|사진.*옆/.test(q)) hitPreset=HELP_PRESETS[1];
    else if(/드라이브|파일.*못 ?찾|어디.*파일/.test(q)) hitPreset=HELP_PRESETS[2];
    else if(/글씨|글자.*작|작아|확대/.test(q)) hitPreset=HELP_PRESETS[3];
  }
  if(hitPreset){
    helpAns={ id:hitPreset.id, q:q, short:hitPreset.short, steps:hitPreset.steps };
  }else if(found){
    helpAns={ id:'topic-'+found.keys[0], q:q, short:found.short, steps:found.steps };
  }else{
    helpAns={ id:'generic', q:q, short:'지금 화면을 캡처해서 "여기서 막혔어요"라고 다시 물어보세요',
      steps:[
        '지금 보이는 화면을 사진으로 찍어 두세요. 아이폰은 옆면 버튼과 위쪽 볼륨 버튼을, 안드로이드는 전원 버튼과 볼륨 아래 버튼을 함께 누르면 됩니다.',
        '화면을 한 번 껐다가 다시 켜 보세요. 앱은 아래에서 위로 밀어 완전히 닫은 뒤 다시 열면 대부분 해결됩니다.',
        '그래도 그대로면, 무엇을 하려다 어디서 멈췄는지 한 줄로 적어 다시 물어보세요. 예: "카톡에서 사진 보내려는데 보내기 버튼이 안 보여요"'
      ]};
  }
  renderHelp();
  setTimeout(()=>{ const a=document.getElementById('answerWrap'); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}); },60);
}

function restoreToday(){
  if(pr.completed || pr.output) return;
  const p=S.profile;
  if(!p) return;
  const r=[...S.records].reverse().find(x=>x.date===todayStr() && x.field===p.field && x.goal===p.goal);
  if(!r) return;
  pr.stepDone=[true,true,true];
  pr.output={ title:r.title, lines:r.lines||[] };
  pr.name=r.name||'';
  pr.completed=true;
}
function boot(){
  updateStreakChip();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab==='practice'));
  if(S.profile){
    restoreToday();
    showView('practice'); renderPractice();
  }else{
    startOnboarding(false);
  }
}
boot();
</script>
</body>
