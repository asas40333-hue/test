<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b1d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>현장 배송 · 원가 정리 | 메종플러스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --brown:#2b1d14; --brown-2:#3d2a1c; --brown-3:#5a4230;
    --gold:#c9a227; --gold-lt:#e6bf4f;
    --emerald:#0f766e; --emerald-lt:#14b8a6;
    --amber:#b45309; --amber-lt:#f59e0b;
    --red:#c2281f; --red-dk:#a8271f;
    --bg:#f6f3ee; --card:#ffffff; --line:#e7e0d4;
    --ink:#221a13; --ink-2:#5a4b3d; --ink-3:#9a8b7b;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;
    max-width:430px;margin:0 auto;padding:0 0 20px;overflow-x:hidden;}
  .hide{display:none !important;}

  /* ── 고정 상단 바 ── */
  header{position:sticky;top:0;z-index:60;background:var(--brown);
    border-bottom:1px solid rgba(201,162,39,.28);box-shadow:0 2px 10px rgba(43,29,20,.14);}
  .hbar{display:flex;align-items:center;gap:8px;padding:8px 12px 5px;}
  .brand-logo{width:26px;height:26px;flex:none;border-radius:7px;
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-lt) 100%);
    color:#2b1d14;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:11px;letter-spacing:-.5px;}
  .brand-title{flex:1;min-width:0;font-size:14px;font-weight:800;letter-spacing:-.4px;line-height:1.2;
    color:#fdf9f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .h-tag{flex:none;font-size:9.5px;font-weight:800;color:var(--gold-lt);
    border:1px solid rgba(201,162,39,.55);background:rgba(201,162,39,.12);
    padding:2px 7px;border-radius:20px;letter-spacing:-.2px;}

  .sumline{display:flex;align-items:center;gap:5px;padding:0 12px 6px;overflow:hidden;}
  .hchip{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto;
    border:1px solid rgba(201,162,39,.4);background:rgba(201,162,39,.1);border-radius:20px;
    padding:2px 8px;color:#e2d5bf;font-size:10.5px;font-weight:700;letter-spacing:-.2px;
    white-space:nowrap;cursor:pointer;line-height:1.5;}
  .hchip span{overflow:hidden;text-overflow:ellipsis;}
  .hchip b{flex:none;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:-.2px;}
  .hchip.warn{border-color:rgba(216,94,86,.7);background:rgba(194,40,31,.24);color:#f0c7c3;}
  .hchip.warn b{color:#ff9f96;}
  .hchip.money{margin-left:auto;border-color:rgba(201,162,39,.6);}
  .hchip.money b{color:var(--gold-lt);}

  .tabs{display:flex;border-top:1px solid rgba(201,162,39,.18);}
  .tabs button{flex:1;min-width:0;border:0;background:transparent;color:#b8a58d;
    font-size:12.3px;font-weight:800;letter-spacing:-.5px;padding:8px 2px 7px;cursor:pointer;
    position:relative;white-space:nowrap;}
  .tabs button.on{color:var(--gold-lt);}
  .tabs button.on:after{content:"";position:absolute;left:16%;right:16%;bottom:0;height:3px;
    background:var(--gold);border-radius:3px 3px 0 0;}

  main{padding:10px 12px 0;}
  .panel{scroll-margin-top:106px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 3px rgba(43,29,20,.06);padding:11px 12px;margin-bottom:8px;}
  .card-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
  .step{width:22px;height:22px;flex:none;border-radius:7px;background:var(--brown);
    color:var(--gold-lt);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .card-head h2{font-size:14px;font-weight:800;letter-spacing:-.5px;}
  .card-head .hint{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:700;
    letter-spacing:-.2px;text-align:right;white-space:nowrap;}

  /* ── 필터 칩 ── */
  .ftabs{display:flex;gap:5px;overflow-x:auto;padding:0 1px 8px;margin:0 -1px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ftabs::-webkit-scrollbar{display:none;}
  .ftab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;
    padding:5px 10px;font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:-.4px;
    cursor:pointer;display:inline-flex;align-items:center;gap:4px;line-height:1.3;}
  .ftab.on{background:var(--brown);border-color:var(--brown);color:#fff;}
  .ftab .c{font-size:10px;font-weight:800;background:#f1ebe2;color:var(--ink-3);border-radius:20px;padding:0 5px;}
  .ftab.on .c{background:rgba(255,255,255,.22);color:#fff;}
  .ftab .c.red{background:#fde3e0;color:var(--red-dk);}

  .list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;}
  .list-head b{font-size:12.5px;font-weight:800;letter-spacing:-.4px;color:var(--ink-2);}
  .list-head span{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:-.2px;}

  /* ── 슬림 주문 카드 ── */
  .oi{background:#fff;border:1px solid var(--line);border-left:3px solid #ddd3c4;border-radius:11px;
    padding:7px 9px 6px;margin-bottom:6px;box-shadow:0 1px 2px rgba(43,29,20,.05);}
  .oi.warn{border-left-color:#d9363e;background:linear-gradient(100deg,#fff6f5 0%,#fff 62%);}
  .oi.done{border-left-color:var(--emerald);background:#f9fcfb;}
  .oi-l1{display:flex;align-items:center;gap:6px;min-width:0;}
  .pill{flex:none;display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:-.2px;
    padding:1px 5px;border-radius:5px;line-height:1.5;}
  .st-ready{background:#eef1f6;color:#4b5872;}
  .st-ship{background:#e6effc;color:#1d4ed8;}
  .st-late{background:#fde3e0;color:var(--red-dk);}
  .st-done{background:#e3f4f0;color:#0f766e;}
  .oi-nm{flex:1;min-width:0;font-size:13.8px;font-weight:800;letter-spacing:-.5px;line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .oi.warn .oi-nm{color:var(--red-dk);}
  .oi-bw{flex:none;font-size:9.3px;font-weight:800;color:var(--red-dk);background:#fde3e0;
    border-radius:5px;padding:1px 5px;letter-spacing:-.3px;white-space:nowrap;}
  .oi-amt{flex:none;font-size:13px;font-weight:800;letter-spacing:-.5px;color:var(--brown);white-space:nowrap;}
  .oi-l2{display:flex;align-items:center;gap:5px;margin-top:3px;min-width:0;}
  .oi-meta{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;
    white-space:nowrap;font-size:10.6px;font-weight:700;color:var(--ink-2);letter-spacing:-.3px;}
  .oi-meta .tg{flex:none;display:inline-block;background:#f4efe7;color:#5a4b3d;border-radius:4px;
    padding:0 4px;font-size:9.8px;font-weight:800;line-height:1.6;}
  .oi-meta .mt{overflow:hidden;text-overflow:ellipsis;}
  .oi-acts{flex:none;display:flex;gap:4px;margin-left:auto;}
  .ib{height:25px;border:1.3px solid var(--line);border-radius:7px;background:#fdfbf8;
    color:var(--ink-2);font-size:10.5px;font-weight:800;letter-spacing:-.4px;cursor:pointer;
    padding:0 6px;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .ib.main{background:var(--emerald);border-color:var(--emerald);color:#fff;}
  .ib.main.on{background:#eef7f5;border-color:#bfded8;color:var(--emerald);}
  .ib.ic{width:26px;padding:0;font-size:11.5px;}
  .ib.del{width:26px;padding:0;font-size:11px;color:#a8410f;background:#f8f2e9;border-color:#efe3d4;}
  .empty{text-align:center;padding:22px 12px;color:var(--ink-3);font-size:12.5px;font-weight:700;
    letter-spacing:-.3px;line-height:1.7;background:#fff;border:1px dashed var(--line);border-radius:12px;margin-bottom:8px;}
  .empty b{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:3px;}

  /* ── 자동 채우기 ── */
  .paste{background:linear-gradient(160deg,#fffdf6 0%,#ffffff 70%);border:1.5px solid #ecdbae;}
  .paste textarea{width:100%;min-height:64px;resize:none;font-size:14px;line-height:1.45;font-weight:600;
    color:var(--ink);padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fffdf8;
    letter-spacing:-.3px;font-family:inherit;}
  .paste textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,162,39,.14);}
  .paste textarea::placeholder{color:#b6a898;font-weight:500;}
  .p-btn{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;margin-top:6px;}
  .p-main{height:40px;border:0;border-radius:10px;background:linear-gradient(135deg,#2b1d14,#4a3322);
    color:var(--gold-lt);font-size:14.5px;font-weight:800;letter-spacing:-.5px;cursor:pointer;
    box-shadow:0 3px 10px rgba(43,29,20,.18);}
  .p-main:active{transform:scale(.985);}
  .p-sub{height:40px;border:1.5px dashed #dcc78d;border-radius:10px;background:#fffaee;color:#8a6a2a;
    font-size:12px;font-weight:800;letter-spacing:-.5px;cursor:pointer;line-height:1.2;}
  .pv{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;}
  .pv-h{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:-.3px;margin-bottom:3px;}
  .pv-row{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-bottom:1px dotted #eee5d6;
    font-size:11.6px;font-weight:700;letter-spacing:-.3px;color:var(--ink-2);}
  .pv-row:last-of-type{border-bottom:0;}
  .pv-row b{flex:1;min-width:0;font-weight:800;color:var(--brown);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pv-row i{flex:none;font-style:normal;font-size:10.3px;font-weight:700;color:var(--ink-3);white-space:nowrap;}
  .pv-btn{margin-top:6px;width:100%;height:38px;border:1.5px solid var(--emerald);border-radius:9px;
    background:#f0faf7;color:var(--emerald);font-size:12.5px;font-weight:800;letter-spacing:-.4px;cursor:pointer;}

  /* ── 폼 ── */
  .field{margin-bottom:7px;}
  .flabel{display:block;font-size:11.3px;font-weight:800;color:var(--ink-3);
    letter-spacing:-.2px;margin-bottom:2px;}
  .flabel .u{font-size:10.3px;color:#b3a493;font-weight:600;margin-left:2px;}
  input[type=text], input[type=date], select{
    width:100%;min-width:0;font-size:16px;font-weight:600;color:var(--ink);
    padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fdfbf8;
    letter-spacing:-.3px;-webkit-appearance:none;appearance:none;}
  input[type=date]{font-weight:700;padding:6px 8px;font-size:14px;}
  select{font-size:13.5px;font-weight:700;padding:7px 6px;}
  input:focus, select:focus{outline:none;border-color:var(--gold);background:#fff;
    box-shadow:0 0 0 3px rgba(201,162,39,.13);}
  input::placeholder{color:#b6a898;font-weight:600;}
  .frow2{display:flex;gap:6px;}
  .frow2 > div{min-width:0;}
  .frow2 .grow{flex:1;}
  .frow2 .vat{width:104px;flex:none;}
  .calc-hint{font-size:10.6px;font-weight:700;color:var(--ink-3);margin-top:3px;letter-spacing:-.2px;line-height:1.45;}
  .calc-hint b{color:var(--brown);font-weight:800;}
  .drow{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .qdates{display:flex;gap:4px;margin-top:4px;}
  .qd{border:1px solid var(--line);background:#fdfbf8;border-radius:7px;font-size:10.6px;
    font-weight:800;color:var(--ink-2);padding:3px 8px;cursor:pointer;letter-spacing:-.3px;}

  .seg{display:flex;gap:4px;background:#f3eee6;padding:3px;border-radius:10px;}
  .seg-btn{flex:1;min-width:0;border:0;background:transparent;padding:6px 2px;border-radius:8px;
    font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.5px;cursor:pointer;
    line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg-btn.on{background:#fff;color:var(--brown);box-shadow:0 1px 4px rgba(43,29,20,.14);font-weight:800;}

  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{border:1.4px solid var(--line);background:#fdfbf8;color:var(--ink-2);
    font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px;
    letter-spacing:-.4px;cursor:pointer;line-height:1.35;display:inline-flex;align-items:center;gap:3px;}
  .chip.on{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:800;}
  .chip.on .ck{color:var(--gold-lt);}
  .chip .ck{font-size:10px;font-weight:900;color:#c9bda9;}
  .chip.add{border-style:dashed;color:var(--ink-3);font-weight:800;}

  .link-btn{border:0;background:transparent;padding:4px 0 0;font-size:10.6px;font-weight:800;
    color:var(--ink-3);text-decoration:underline;cursor:pointer;letter-spacing:-.2px;}
  .mgr{margin-top:6px;border:1px dashed var(--line);border-radius:9px;padding:7px;background:#fdfbf8;}
  .mgr-row{display:grid;grid-template-columns:minmax(0,1fr) 50px;gap:5px;margin-bottom:5px;}
  .mgr-row:last-child{margin-bottom:0;}
  .mgr-in{padding:7px 8px !important;font-size:14px !important;}
  .mgr-del{height:34px;border-radius:8px;border:0;background:#f7f1e8;color:#a8410f;
    font-size:11px;font-weight:800;cursor:pointer;letter-spacing:-.3px;}

  .add-btn{width:100%;height:44px;border:0;border-radius:11px;
    background:linear-gradient(135deg,var(--gold) 0%,var(--gold-lt) 100%);
    color:#2b1d14;font-size:15px;font-weight:800;letter-spacing:-.5px;cursor:pointer;
    box-shadow:0 4px 12px rgba(201,162,39,.26);}
  .add-btn:active{transform:scale(.985);}
  .btn-line{height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-2);
    font-size:12.5px;font-weight:800;letter-spacing:-.4px;cursor:pointer;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .btn-primary{height:48px;border:0;border-radius:11px;background:var(--brown);color:#fff;
    font-size:14.5px;font-weight:800;letter-spacing:-.4px;cursor:pointer;width:100%;}
  .btn-primary:active{transform:scale(.985);}
  .btn-print{height:46px;border:1.5px solid var(--brown);border-radius:11px;background:#fff;color:var(--brown);
    font-size:13.5px;font-weight:800;letter-spacing:-.4px;cursor:pointer;width:100%;margin-top:7px;}
  .brandline{margin:12px 0 10px;text-align:center;font-size:10.6px;color:#b7a794;letter-spacing:-.2px;line-height:1.7;}

  /* ── 원가 ── */
  .money{background:var(--brown);border-radius:12px;padding:11px 13px;color:#fdf9f2;}
  .m-lab{font-size:11px;font-weight:800;color:#c9b79f;letter-spacing:-.2px;}
  .m-lab small{font-weight:700;color:#8f7f6c;margin-left:4px;font-size:10px;}
  .m-total{font-size:25px;font-weight:800;letter-spacing:-1.3px;line-height:1.15;margin-top:2px;color:var(--gold-lt);}
  .m-sub{display:flex;gap:14px;margin-top:4px;font-size:11.3px;font-weight:700;color:#d8cbb9;}
  .m-sub b{color:#fff;font-weight:800;}
  .m-note{margin-top:6px;font-size:10.3px;color:#a8998a;font-weight:600;letter-spacing:-.2px;line-height:1.5;}
  .subhead{font-size:11.3px;font-weight:800;color:var(--ink-3);letter-spacing:-.2px;margin:9px 0 1px;}
  .subhead:first-child{margin-top:0;}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;
    border-bottom:1px dashed var(--line);font-size:12.8px;font-weight:700;letter-spacing:-.3px;}
  .srow:last-child{border-bottom:0;}
  .srow .s-l{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .srow .s-l i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3);margin-left:3px;}
  .srow b{font-weight:800;letter-spacing:-.4px;white-space:nowrap;}
  .srow.tot{border-top:1.5px solid var(--brown);border-bottom:0;margin-top:2px;padding-top:8px;}
  .srow.tot b{color:var(--brown);font-size:14px;}
  .srow.priv b{color:var(--ink-3);}
  .muted{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:6px 0;letter-spacing:-.3px;}
  .note-line{font-size:10.8px;font-weight:700;color:var(--ink-3);letter-spacing:-.2px;line-height:1.5;margin-bottom:8px;}

  /* ── toast ── */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
    background:#1c140e;color:#fff;font-size:12.8px;font-weight:700;letter-spacing:-.3px;padding:11px 16px;
    border-radius:11px;z-index:120;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.ok{background:#0f766e;}
  .toast.warn{background:#a8410f;}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(201,162,39,.55);}100%{box-shadow:0 0 0 10px rgba(201,162,39,0);}}
  .flash{animation:flash .7s ease;}

  /* ── print ── */
  #printDoc{display:none;}
  @media print{
    @page{size:A4;margin:14mm 13mm 12mm;}
    html,body{background:#fff !important;max-width:none !important;padding:0 !important;margin:0 !important;}
    header,main,.toast{display:none !important;}
    #printDoc{display:block !important;color:#141414;font-size:10.2pt;line-height:1.45;}
    #printDoc .p-brand{font-size:.76em;letter-spacing:.18em;color:#8a6a2a;font-weight:800;}
    #printDoc .p-title{font-size:1.7em;font-weight:800;letter-spacing:-.04em;margin:.08em 0 .06em;line-height:1.2;}
    #printDoc .p-sub{font-size:.76em;color:#666;margin-bottom:.85em;}
    #printDoc .p-h{font-size:.94em;font-weight:800;border-bottom:2px solid #2b1d14;padding-bottom:.16em;margin:.8em 0 .38em;}
    #printDoc table{width:100%;border-collapse:collapse;font-size:.79em;table-layout:fixed;}
    #printDoc th{background:#f4f0e8;color:#5a4b3d;font-weight:700;text-align:left;
      padding:.32em .38em;border:1px solid #ddd4c6;}
    #printDoc td{padding:.32em .38em;border:1px solid #ddd4c6;font-weight:600;vertical-align:top;word-break:keep-all;}
    #printDoc tr{page-break-inside:avoid;}
    #printDoc .r{text-align:right;}
    #printDoc .c{text-align:center;}
    #printDoc .p-sum{display:flex;border:1px solid #ddd4c6;border-radius:4px;overflow:hidden;}
    #printDoc .p-sum > div{flex:1;padding:.42em .6em;border-right:1px solid #ddd4c6;}
    #printDoc .p-sum > div:last-child{border-right:0;background:#fdf6e3;}
    #printDoc .p-sum .l{font-size:.74em;color:#5a4b3d;font-weight:700;}
    #printDoc .p-sum .v{font-size:1em;font-weight:800;margin-top:.1em;}
    #printDoc .p-two{display:flex;gap:9px;}
    #printDoc .p-two > div{flex:1;min-width:0;}
    #printDoc .p-warn{color:#a8271f;font-weight:800;}
    #printDoc .p-foot{margin-top:.9em;font-size:.7em;color:#777;border-top:1px solid #ddd;padding-top:.4em;line-height:1.55;}
  }
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand-logo">M+</div>
    <div class="brand-title">현장 배송 · 원가 정리</div>
    <div class="h-tag">05호</div>
  </div>
  <div class="sumline" id="sumLine">
    <button type="button" class="hchip" data-go="ship"><span>오늘 도착</span><b id="cToday">0</b></button>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var LS = "mp_app05_state_v1";

  var SITE_DEFAULT = [
    {id:"s_site",   name:"현장"},
    {id:"s_office", name:"사무실"},
    {id:"s_home",   name:"자택"}
  ];
  var STATUS = {
    ready:{label:"준비중",  cls:"st-ready"},
    ship: {label:"배송중",  cls:"st-ship"},
    late: {label:"지연",    cls:"st-late"},
    done: {label:"도착완료",cls:"st-done"}
  };
  var CATS = {mat:"현장 자재", office:"사무비품", private:"개인용"};
  var VATS = {incl:"부가세 포함", excl:"부가세 별도", none:"면세·간이"};
  var SHOPS = {coupang:"쿠팡", naver:"네이버", today:"오늘의집", etc:"기타"};

  var state = {items:[], sites:[], filter:"all"};
  var form = {vat:"incl", cat:"mat", status:"ready", site:"s_site", shop:"etc"};
  var editingId = null;
  var curTab = "ship";

  /* ── helpers ── */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function parseISO(v){
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    var p = v.split("-");
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function addDays(iso, n){
    var d = parseISO(iso);
    if (!d) return "";
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function WD(d){ return "일월화수목금토".charAt(d.getDay()); }
  function cleanDate(v){
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return "";
    var y = parseInt(v.slice(0, 4), 10);
    return (y >= 2000 && y <= 2100) ? v : "";
  }
  function dmd(v){                 /* 11.18.(화) */
    var d = parseISO(v);
    if (!d) return "";
    return (d.getMonth()+1) + "." + d.getDate() + "." + "(" + WD(d) + ")";
  }
  function dfull(v){               /* 2026. 11. 18. */
    var d = parseISO(v);
    if (!d) return "";
    return d.getFullYear() + ". " + (d.getMonth()+1) + ". " + d.getDate() + ".";
  }
  function fmt(n){
    n = Math.round(Number(n) || 0);
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function won(n){ return fmt(n) + "원"; }
  function uid(){ return "o" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  var toastTimer = null;
  function toast(msg, kind){
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = "toast" + (kind ? " " + kind : ""); }, 2400);
  }
  function copyFallback(text, done){
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch(e){ done(false); }
  }
  function copyText(text, okMsg){
    var done = function(ok){
      toast(ok ? (okMsg || "✅ 복사했습니다") : "복사가 막혔습니다. 인쇄로 저장해 주세요", ok ? "ok" : "warn");
    };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ copyFallback(text, done); });
    } else { copyFallback(text, done); }
  }

  /* ── 계산 ── */
  function calc(it){
    var a = Number(it.amount) || 0, supply, vat, total;
    if (it.vat === "excl"){ supply = a; vat = Math.round(a * 0.1); total = a + vat; }
    else if (it.vat === "none"){ supply = a; vat = 0; total = a; }
    else { total = a; supply = Math.round(a / 1.1); vat = a - supply; }
    return {supply:supply, vat:vat, total:total};
  }
  function calcAll(list){
    var s = {n:0, supply:0, vat:0, total:0};
    list.forEach(function(it){
      var c = calc(it);
      s.n++; s.supply += c.supply; s.vat += c.vat; s.total += c.total;
    });
    return s;
  }
  function isBus(it){ return it.cat !== "private"; }
  function siteName(id){
    for (var i = 0; i < state.sites.length; i++) if (state.sites[i].id === id) return state.sites[i].name;
    return "배송지";
  }
  function warns(it){
    if (it.status === "done") return [];
    var w = [];
    if (it.status === "late") w.push("지연 표시됨");
    if (it.proc && it.eta && it.eta > it.proc) w.push("투입일(" + dmd(it.proc) + ")보다 늦게 도착 예정");
    if (it.eta && it.eta < todayISO()) w.push("도착 예정일(" + dmd(it.eta) + ")이 지났는데 미도착");
    return w;
  }
  function warnShort(it){
    if (!warns(it).length) return "";
    var t = todayISO();
    if (it.eta && it.eta < t) return "도착일 지남";
    if (it.status === "late") return "지연";
    if (it.proc && it.eta && it.eta > it.proc) return "투입일 초과";
    return "확인";
  }
  function find(id){
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  function sortItems(a, b){
    var wa = warns(a).length, wb = warns(b).length;
    if (!!wa !== !!wb) return wa ? -1 : 1;
    var da = a.status === "done" ? 1 : 0, db = b.status === "done" ? 1 : 0;
    if (da !== db) return da - db;
    var ea = a.eta || "9999-99-99", eb = b.eta || "9999-99-99";
    if (ea !== eb) return ea < eb ? -1 : 1;
    return (b.created || 0) - (a.created || 0);
  }

  /* ── 저장 / 불러오기 ── */
  function save(){
    try {
      localStorage.setItem(LS, JSON.stringify({items:state.items, sites:state.sites}));
    } catch(e){}
  }
  function load(){
    var d = null;
    try {
      var raw = localStorage.getItem(LS);
      if (raw) d = JSON.parse(raw);
    } catch(e){ d = null; }

    if (d && Object.prototype.toString.call(d.items) === "[object Array]"){
      state.sites = (d.sites && d.sites.length) ? d.sites : SITE_DEFAULT.slice();
      state.items = d.items.filter(function(it){ return it && it.id && it.name; }).map(function(it){
        return {
          id:it.id, name:String(it.name), amount:Number(it.amount) || 0,
          vat:(VATS[it.vat] ? it.vat : "incl"), cat:(CATS[it.cat] ? it.cat : "mat"),
          shop:(SHOPS[it.shop] ? it.shop : guessShopFromMemo(it.memo)),
          site:(it.site || state.sites[0].id), proc:cleanDate(it.proc), eta:cleanDate(it.eta),
          status:(STATUS[it.status] ? it.status : "ready"), memo:it.memo || "",
          created:it.created || Date.now()
        };
      });
    } else {
      state.sites = SITE_DEFAULT.slice();
      seedSamples(false);
    }
    if (!state.sites.length) state.sites = SITE_DEFAULT.slice();
    form.site = state.sites[0].id;
  }

  function ensureSite(name, fallbackId){
    for (var i = 0; i < state.sites.length; i++){
      if (state.sites[i].name === name) return state.sites[i].id;
    }
    var id = uid();
    state.sites.push({id:id, name:name});
    return id;
  }

  function seedSamples(notify){
    var t = todayISO();
    var siteId  = ensureSite("현장", "s_site");
    var officeId = ensureSite("사무실", "s_office");
    var homeId  = ensureSite("자택", "s_home");
    var now = Date.now();
    state.items = [
      {id:uid(), name:"욕실 도어씰 3개", amount:42000, vat:"incl", cat:"mat", site:siteId, shop:"coupang",
       proc:addDays(t,-1), eta:addDays(t,1), status:"late", memo:"도어 하부 물막이 · 3개입", created:now-4000},
      {id:uid(), name:"실리콘 · 부자재", amount:68000, vat:"incl", cat:"mat", site:siteId, shop:"naver",
       proc:addDays(t,2), eta:addDays(t,1), status:"ship", memo:"백색 실리콘 2통, 마스킹테이프", created:now-3000},
      {id:uid(), name:"업무용 노트북 거치대", amount:39000, vat:"incl", cat:"office", site:officeId, shop:"coupang",
       proc:"", eta:t, status:"ready", memo:"사무실 책상용", created:now-2000},
      {id:uid(), name:"생활용품 (주방세제 등)", amount:12900, vat:"incl", cat:"private", site:homeId, shop:"today",
       proc:"", eta:addDays(t,2), status:"ready", memo:"", created:now-1000}
    ];
    save();
    if (notify) toast("✅ 예시 4건을 불러왔습니다 (지연 경고 포함)", "ok");
  }

  /* ── 주문 내역 자동 파싱 ── */
  var SITE_KEYS = [
    {re:/(현장|한빛|어은동|공사장|착공|1406)/, name:"현장"},
    {re:/(사무실|사무|유천동|유천|오피스|매장|작업실)/, name:"사무실"},
    {re:/(자택|우리집|집으로|버드네)/, name:"자택"}
  ];
  var PRIV_RE = /(생활용품|주방세제|세제|화장품|샴푸|치약|식료품|과자|커피|생필품|의류|옷|신발|장난감|반려|간식|과일|음료|휴지)/;
  var DEMO_TEXT = "쿠팡 BMC 인조대리석 도어씰 2개 46,000원 유천동 사무실 11/20 도착\n" +
    "로지텍 마우스 40,770원 자택 배송중\n" +
    "오늘의집 욕실 선반 32,900원 현장 내일 도착 예정\n" +
    "네이버 실리콘 백색 3통 21,000원 사무실 도착완료";

  function guessShopFromMemo(m){
    m = String(m || "");
    if (/쿠팡/.test(m)) return "coupang";
    if (/네이버|스마트/.test(m)) return "naver";
    if (/오늘의집/.test(m)) return "today";
    return "etc";
  }
  function parseShop(t){
    if (/쿠팡|coupang/i.test(t)) return "coupang";
    if (/네이버|스마트스토어|naver/i.test(t)) return "naver";
    if (/오늘의집|todayhouse/i.test(t)) return "today";
    return "etc";
  }
  function parseStatus(t){
    if (/(도착\s*완료|수령\s*완료|수령|받음|받았|인수)/.test(t)) return "done";
    if (/(지연|미도착|늦|초과|반품)/.test(t)) return "late";
    if (/(배송\s*중|배송중|출발|집하|간선|배송\s*시작|픽업)/.test(t)) return "ship";
    return "ready";
  }
  function parseMoney(t){
    var m = t.match(/([0-9][0-9,]{2,})\s*원/) || t.match(/₩\s*([0-9][0-9,]*)/);
    if (!m){
      var cands = (t.match(/[0-9][0-9,]{2,}/g) || []).filter(function(s){
        var n = parseInt(s.replace(/,/g, ""), 10);
        return n >= 1000 && !(n >= 2000 && n <= 2100);
      });
      if (cands.length) m = [null, cands[0]];
    }
    return m ? (parseInt(String(m[1]).replace(/[^\d]/g, ""), 10) || 0) : 0;
  }
  function parseWhen(t){
    var td = todayISO();
    t = String(t).replace(/오늘의집|todayhouse/gi, " ");
    if (/오늘/.test(t)) return td;
    if (/내일/.test(t)) return addDays(td, 1);
    if (/모레/.test(t)) return addDays(td, 2);
    var m = null, y = 0, mo = 0, d = 0;
    if ((m = t.match(/(20\d{2})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/))){
      y = +m[1]; mo = +m[2]; d = +m[3];
    } else if ((m = t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일?/))){
      mo = +m[1]; d = +m[2];
    } else if ((m = t.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/))){
      mo = +m[1]; d = +m[2];
    }
    if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return "";
    var now = parseISO(td);
    var dt = new Date(y || now.getFullYear(), mo - 1, d);
    if (dt.getTime() < now.getTime() - 180 * 86400000) dt = new Date(dt.getFullYear() + 1, mo - 1, d);
    return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
  }
  function parseName(t){
    var s = " " + t + " ";
    s = s.replace(/(쿠팡|coupang|네이버|스마트스토어|naver|오늘의집|todayhouse)/gi, " ");
    s = s.replace(/[₩]?\s*[0-9][0-9,]*\s*원/g, " ");
    s = s.replace(/₩\s*[0-9][0-9,]*/g, " ");
    s = s.replace(/20\d{2}\s*[-.\/년]\s*\d{1,2}\s*[-.\/월]\s*\d{1,2}\s*일?/g, " ");
    s = s.replace(/\d{1,2}\s*월\s*\d{1,2}\s*일?/g, " ");
    s = s.replace(/\d{1,2}\s*[\/.]\s*\d{1,2}(?!\d)\s*일?/g, " ");
    s = s.replace(/(오늘|내일|모레)/g, " ");
    s = s.replace(/(현장|한빛|어은동|공사장|착공|1406|사무실|사무|유천동|유천|오피스|매장|작업실|자택|우리집|버드네|집으로)/g, " ");
    s = s.replace(/(도착\s*완료|수령\s*완료|도착\s*예정|도착|수령|받음|받았|인수|배송\s*중|배송중|출발|집하|간선|배송\s*시작|픽업|지연|미도착|초과|반품|예정)/g, " ");
    s = s.replace(/[·,\-–—:;|\[\](){}<>"'“”‘’]/g, " ");
    s = s.replace(/\s+/g, " ").trim();
    s = s.replace(/^(주문|결제|구매|송장|배송지|주소)\s*/, "");
    s = s.replace(/\s*(에서|으로|로|에|은|는|이|가|을|를)$/, "");
    return s.slice(0, 40).trim();
  }
  function parseOrders(text){
    return String(text || "").split(/\r?\n/).map(function(line){
      var t = line.trim();
      if (t.length < 2) return null;
      var amt = parseMoney(t);
      if (!amt && !/(원|현장|사무실|자택|도착|배송)/.test(t)) return null;
      var name = parseName(t);
      if (!name || name.length < 2) return null;
      return {name:name, amount:amt, shop:parseShop(t), status:parseStatus(t), eta:parseWhen(t), raw:t};
    }).filter(Boolean);
  }
  function siteGuessName(raw, name){
    var txt = (raw || "") + " " + (name || "");
    for (var i = 0; i < state.sites.length; i++){
      if (state.sites[i].name && txt.indexOf(state.sites[i].name) >= 0) return state.sites[i].name;
    }
    for (var k = 0; k < SITE_KEYS.length; k++){
      if (SITE_KEYS[k].re.test(txt)) return SITE_KEYS[k].name;
    }
    return "";
  }
  function resolveSite(raw, name){
    var want = siteGuessName(raw, name);
    if (!want) return state.sites[0].id;
    for (var i = 0; i < state.sites.length; i++) if (state.sites[i].name === want) return state.sites[i].id;
    return ensureSite(want);
  }
  function guessCat(name, siteNm){
    if (PRIV_RE.test(name || "")) return "private";
    if (siteNm && siteNm.indexOf("현장") >= 0) return "mat";
    return "office";
  }

  function saveItem(){
    var name = $("fName").value.trim();
    var amt = parseAmount($("fAmount").value);
    if (!name){ toast("품목명을 적어 주세요", "warn"); $("fName").focus(); return; }
    if (!(amt > 0)){ toast("금액을 숫자로 적어 주세요", "warn"); $("fAmount").focus(); return; }

    var proc = cleanDate($("fProc").value), eta = cleanDate($("fEta").value);
    var old = editingId ? find(editingId) : null;

    var obj = {
      id: editingId || uid(),
      name: name, amount: amt, vat: form.vat, cat: form.cat, site: form.site, shop: form.shop,
      proc: proc, eta: eta, status: form.status, memo: $("fMemo").value.trim(),
      created: old ? (old.created || Date.now()) : Date.now()
    };

    if (old){
      for (var i = 0; i < state.items.length; i++){
        if (state.items[i].id === old.id){ state.items[i] = obj; break; }
      }
    } else {
      state.items.push(obj);
    }
    save(); renderAll();

    var lateHint = (obj.status !== "done" && proc && eta && eta > proc);
    if (old){
      toast(lateHint ? "✅ 수정했습니다 · 투입일보다 늦게 도착 예정" : "✅ 수정했습니다", lateHint ? "warn" : "ok");

  function buildText(){
    var bus = state.items.filter(isBus);
    var sum = calcAll(bus);
    var open = state.items.filter(function(it){ return it.status !== "done"; });
    var warnItems = state.items.filter(function(it){ return warns(it).length > 0; });
    var t = todayISO();
    var L = [];
    L.push("[메종플러스] 현장 원가 요약 (" + dfull(t).replace(/\.\s*$/, "") + " 기준)");
    L.push("· 현장·사업 " + bus.length + "건 (개인용 " + (state.items.length - bus.length) + "건 제외)");
    L.push("· 공급가액 " + won(sum.supply) + " + 부가세 " + won(sum.vat) + " = " + won(sum.total));
    L.push("");

    L.push("▸ 배송지·현장별");
    state.sites.forEach(function(s){
      var list = bus.filter(function(it){ return it.site === s.id; });
      if (!list.length) return;
      L.push("  - " + s.name + ": " + list.length + "건 " + won(calcAll(list).total));
    });
    L.push("");
    L.push("▸ 용도별");
    ["mat","office"].forEach(function(k){
      var list = bus.filter(function(it){ return it.cat === k; });
      if (!list.length) return;
      L.push("  - " + CATS[k] + ": " + list.length + "건 " + won(calcAll(list).total));
    });
    L.push("");

    L.push("▸ 아직 안 온 건 (" + open.length + ")");
    if (!open.length) L.push("  - 없음");
    open.slice().sort(sortItems).forEach(function(it){
      L.push("  - " + (it.shop && it.shop !== "etc" ? "[" + SHOPS[it.shop] + "] " : "") + it.name + " / " + siteName(it.site) +
        (it.eta ? " / 도착 " + dmd(it.eta) : "") + " / " + STATUS[it.status].label +
        " (" + won(calc(it).total) + ")");
    });
    L.push("");

    if (warnItems.length){
      L.push("▸ ⚠ 지연 · 투입일 초과 (" + warnItems.length + ")");
      warnItems.forEach(function(it){
        L.push("  - " + it.name + ": " + warns(it).join(" / "));
      });
      L.push("");
    }
    L.push("※ 현장·사업 지출만 집계(개인용 제외) / 메종플러스");
    return L.join("\n");
  }

  /* ── 인쇄 문서 ── */
  function buildDoc(){
    var bus = state.items.filter(isBus);
    var sum = calcAll(bus);
    var all = state.items.slice().sort(sortItems);
    var warnItems = state.items.filter(function(it){ return warns(it).length > 0; });
    var open = state.items.filter(function(it){ return it.status !== "done"; });

    var h = '<div class="p-brand">MAISON PLUS · 메종플러스</div>';
    h += '<div class="p-title">현장 배송 · 원가 정리</div>';
    h += '<div class="p-sub">출력일 ' + dfull(todayISO()) + ' · 현장·사업 지출만 집계(개인용 제외) · 부가세 10% 기준</div>';

    h += '<div class="p-sum">' +
      '<div><div class="l">공급가액</div><div class="v">' + won(sum.supply) + '</div></div>' +
      '<div><div class="l">매입 부가세</div><div class="v">' + won(sum.vat) + '</div></div>' +
      '<div><div class="l">합계 (현장·사업 ' + sum.n + '건)</div><div class="v">' + won(sum.total) + '</div></div>' +
      '</div>';

    h += '<div class="p-h">배송지별 · 용도별 합계</div><div class="p-two">';

    h += '<div><table><colgroup><col style="width:58%"><col style="width:14%"><col style="width:28%"></colgroup>' +
      '<tr><th>배송지</th><th class="r">건수</th><th class="r">합계</th></tr>';
    state.sites.forEach(function(s){
      var list = bus.filter(function(it){ return it.site === s.id; });
      if (!list.length) return;
      h += '<tr><td>' + esc(s.name) + '</td><td class="r">' + list.length + '</td><td class="r">' +
        won(calcAll(list).total) + '</td></tr>';
    });
    h += '<tr><td><b>현장·사업 합계</b></td><td class="r"><b>' + sum.n + '</b></td><td class="r"><b>' + won(sum.total) + '</b></td></tr>';
    h += '</table></div>';

    h += '<div><table><colgroup><col style="width:58%"><col style="width:14%"><col style="width:28%"></colgroup>' +
      '<tr><th>구분</th><th class="r">건수</th><th class="r">합계</th></tr>';
    ["mat","office"].forEach(function(k){
      var list = bus.filter(function(it){ return it.cat === k; });
      if (!list.length) return;
      h += '<tr><td>' + CATS[k] + '</td><td class="r">' + list.length + '</td><td class="r">' +
        won(calcAll(list).total) + '</td></tr>';
    });
    h += '<tr><td>공급가액</td><td class="r">-</td><td class="r">' + won(sum.supply) + '</td></tr>';
    h += '<tr><td>부가세</td><td class="r">-</td><td class="r">' + won(sum.vat) + '</td></tr>';
    h += '</table></div></div>';

    h += '<div class="p-h">주문 · 배송 상세 (' + all.length + '건)</div>';
    h += '<table><colgroup><col style="width:26%"><col style="width:11%"><col style="width:12%">' +
      '<col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:11%"><col style="width:10%"></colgroup>' +
      '<tr><th>품목</th><th>배송지</th><th>구분</th><th>투입일</th><th>도착예정</th><th>상태</th><th class="r">공급가액</th><th class="r">부가세</th></tr>';
    all.forEach(function(it){
      var c = calc(it);
      var tails = [];
      if (it.shop && it.shop !== "etc") tails.push(SHOPS[it.shop]);
      if (it.memo) tails.push(it.memo);
      h += '<tr><td>' + esc(it.name) + (tails.length ? '<br><span style="font-size:.9em;color:#777">' + esc(tails.join(" · ")) + '</span>' : '') + '</td>' +
        '<td>' + esc(siteName(it.site)) + '</td>' +
        '<td>' + esc(CATS[it.cat] || "") + (isBus(it) ? "" : '<br><span style="font-size:.88em;color:#999">집계제외</span>') + '</td>' +
        '<td>' + (it.proc ? dmd(it.proc) : "-") + '</td>' +
        '<td>' + (it.eta ? dmd(it.eta) : "-") + '</td>' +
        '<td>' + STATUS[it.status].label + '</td>' +
        '<td class="r">' + fmt(c.supply) + '</td>' +
        '<td class="r">' + fmt(c.vat) + '</td></tr>';
    });
    h += '<tr><td colspan="6"><b>현장·사업 합계 (개인용 제외)</b></td><td class="r"><b>' + fmt(sum.supply) +
      '</b></td><td class="r"><b>' + fmt(sum.vat) + '</b></td></tr>';
    h += '</table>';

    h += '<div class="p-h">⚠ 지연 · 투입일 초과 · 미도착</div>';
    if (!warnItems.length && !open.length){
      h += '<div style="font-size:.85em;font-weight:700;color:#0f766e">해당 없음 — 모든 배송이 정상입니다.</div>';
    } else {
      h += '<table><colgroup><col style="width:30%"><col style="width:16%"><col style="width:18%"><col style="width:36%"></colgroup>' +
        '<tr><th>품목</th><th>배송지</th><th>도착예정</th><th>내용</th></tr>';
      var flagged = all.filter(function(it){ return warns(it).length > 0; });
      flagged.forEach(function(it){
        h += '<tr><td>' + esc(it.name) + '</td><td>' + esc(siteName(it.site)) + '</td><td>' +
          (it.eta ? dmd(it.eta) : "-") + '</td><td class="p-warn">' + esc(warns(it).join(" / ")) + '</td></tr>';
      });
      var calm = open.filter(function(it){ return warns(it).length === 0; });
      calm.forEach(function(it){
        h += '<tr><td>' + esc(it.name) + '</td><td>' + esc(siteName(it.site)) + '</td><td>' +
          (it.eta ? dmd(it.eta) : "-") + '</td><td>미도착 · ' + STATUS[it.status].label + '</td></tr>';
      });
      h += '</table>';
    }

    h += '<div class="p-foot">이 문서는 메종플러스 ‘현장 배송 · 원가 정리’에서 출력했습니다. ' +
      '현장·사업 지출(현장 자재·사무비품)만 집계했고 개인용은 제외했습니다. ' +
      '부가세는 입력한 금액을 기준으로 포함·별도·면세를 구분해 계산했습니다.</div>';

    return h;
  }

  function doPrint(){
    var doc = $("printDoc");
    doc.innerHTML = buildDoc();
    setTimeout(function(){ window.print(); }, 80);
  }

  /* ── 이벤트 ── */
  function bind(){
    $("tabs").addEventListener("click", function(e){
      var b = e.target.closest("[data-tab]"); if (!b) return;
      setTab(b.getAttribute("data-tab"));
    });
    $("sumLine").addEventListener("click", function(e){
      var b = e.target.closest("[data-go]"); if (!b) return;
      setTab(b.getAttribute("data-go"));
    });

    $("fAmount").addEventListener("input", function(e){
      var d = e.target.value.replace(/[^\d]/g, "").slice(0, 10);
      e.target.value = d ? fmt(d) : "";
      updateCalcHint();
    });
    $("fVat").addEventListener("change", function(e){
      form.vat = e.target.value;
      updateCalcHint();
    });
    $("fCat").addEventListener("click", function(e){
      var b = e.target.closest(".seg-btn"); if (!b) return;
      form.cat = b.getAttribute("data-cat");
      setSeg("fCat","data-cat",form.cat);
      updateCalcHint();
    });
    $("fStatus").addEventListener("click", function(e){
      var b = e.target.closest(".seg-btn"); if (!b) return;
      form.status = b.getAttribute("data-st");
      setSeg("fStatus","data-st",form.status);
    });
    $("fShop").addEventListener("click", function(e){
      var b = e.target.closest("[data-shop]"); if (!b) return;
      form.shop = b.getAttribute("data-shop");
      renderShop();
    });
    $("pasteDemo").addEventListener("click", function(){
      var ta = $("pasteIn");
      ta.value = DEMO_TEXT;
      ta.focus();
      toast("예시 문구를 넣었습니다 · ⚡ 자동 채우기를 누르세요");
    });
    $("pasteGo").addEventListener("click", function(){
      var list = parseOrders($("pasteIn").value);
      if (!list.length){
        toast("읽을 주문 내역이 없습니다. 한 줄에 한 건씩 넣어 주세요", "warn");
        $("pasteIn").focus();
        return;
      }
      lastParsed = list;
      applyParsed(list[0]);
      renderPreview(list);
      setTimeout(function(){
        $("formCard").scrollIntoView({behavior:"smooth", block:"start"});
      }, 60);
      var more = list.length - 1;
      toast("⚡ " + list.length + "건 인식" + (more ? " · 1건 폼에, " + more + "건 미리보기" : " · 폼에 채웠습니다"), "ok");
    });
    document.querySelector(".qdates").addEventListener("click", function(e){
      var b = e.target.closest(".qd"); if (!b) return;
      $("fEta").value = addDays(todayISO(), parseInt(b.getAttribute("data-qd"), 10));
      toast("도착 예정일 " + dmd($("fEta").value));
    });

    $("fSites").addEventListener("click", function(e){
      var add = e.target.closest("[data-addsite]");
      if (add){
        var nm = window.prompt("배송지 이름을 적어 주세요 (예: 한빛 1406)");
        if (nm === null) return;
        nm = String(nm).trim().slice(0, 16);
        if (!nm){ toast("이름이 비어 있습니다", "warn"); return; }
        var dup = state.sites.filter(function(s){ return s.name === nm; })[0];
        if (dup){ form.site = dup.id; renderSites(); toast("이미 있는 배송지입니다"); return; }
        var id = uid();
        state.sites.push({id:id, name:nm});
        form.site = id;
        save(); renderSites(); renderTabs(); toast("✅ '" + nm + "' 배송지를 넣었습니다", "ok");
        return;
      }
      var b = e.target.closest("[data-site]");
      if (!b) return;
      form.site = b.getAttribute("data-site");
      renderSites();
    });

    $("mgrToggle").addEventListener("click", function(){
      var m = $("siteMgr");
      if (m.classList.contains("hide")){ m.classList.remove("hide"); renderMgr(); }
      else m.classList.add("hide");
    });
    $("siteMgr").addEventListener("change", function(e){
      var inp = e.target.closest(".mgr-in"); if (!inp) return;
      var sid = inp.getAttribute("data-sid");
      var nm = inp.value.trim().slice(0, 16);
      if (!nm){ toast("이름이 비어 있습니다", "warn"); renderMgr(); return; }
      state.sites.forEach(function(s){ if (s.id === sid) s.name = nm; });
      save(); renderSites(); renderTabs(); renderList(); renderSum(); toast("이름을 바꿨습니다");
    });
    $("siteMgr").addEventListener("click", function(e){
      var b = e.target.closest("[data-del]"); if (!b) return;
      var sid = b.getAttribute("data-del");
      if (state.sites.length <= 1){ toast("배송지는 하나 이상 있어야 합니다", "warn"); return; }
      var used = state.items.filter(function(it){ return it.site === sid; }).length;
      if (used){ toast("이 배송지에 " + used + "건이 있어 지울 수 없습니다", "warn"); return; }
      if (!window.confirm('"' + siteName(sid) + '" 배송지를 지울까요?')) return;
      state.sites = state.sites.filter(function(s){ return s.id !== sid; });
      if (form.site === sid){
        var cur = editingId ? find(editingId) : null;
        form.site = (cur && cur.site !== sid) ? cur.site : state.sites[0].id;
      }
      if (state.filter === "site:" + sid) state.filter = "all";
      save(); renderAll(); renderMgr(); toast("배송지를 지웠습니다");
    });

    $("fSave").addEventListener("click", saveItem);
    $("fCancel").addEventListener("click", function(){ resetForm(); toast("수정을 취소했습니다"); });

    $("list").addEventListener("click", function(e){
      var b = e.target.closest("[data-act]"); if (!b) return;
      var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
      if (act === "done") toggleDone(id);
      else if (act === "edit") startEdit(id);
      else if (act === "del") delItem(id);
    });

    $("ftabs").addEventListener("click", function(e){
      var b = e.target.closest("[data-f]"); if (!b) return;
      state.filter = b.getAttribute("data-f");
      renderTabs(); renderList();
    });

    $("copyBtn").addEventListener("click", function(){ copyText(buildText(), "✅ 원가 요약을 복사했습니다"); });
    $("printBtn").addEventListener("click", doPrint);

    $("seedBtn").addEventListener("click", function(){
      if (state.items.length && !window.confirm("예시 4건으로 채울까요?\n지금 입력한 내역은 지워집니다.")) return;
      seedSamples(true);
      state.filter = "all";
      renderAll();
      setTab("ship");
    });
    $("clearBtn").addEventListener("click", function(){
      if (!state.items.length){ toast("이미 비어 있습니다"); return; }
      if (!window.confirm("등록한 내역 " + state.items.length + "건을 모두 지울까요?\n되돌릴 수 없습니다.")) return;
      state.items = [];
      resetForm(); save(); renderAll(); toast("모두 지웠습니다");
    });

    window.addEventListener("beforeprint", function(){
      if (!$("printDoc").innerHTML) $("printDoc").innerHTML = buildDoc();
    });
  }

  /* ── 시작 ── */
  load();
  bind();
  renderAll();
  resetForm();
  setTab("ship");
})();
</script>
</body>
</html>
