<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px 검증용 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#c9c9c9;}
  #frame{width:390px;height:1990px;border:0;display:block;background:#fff;}
</style>
</head>
<body>
<iframe id="frame" src="diary.html?v=guksu390" title="성수의 하루 국수나무 수필 390px"></iframe>
<script>
  // 검증용: 하단 고정 '오늘의 기록 남기기' 버튼과 그라데이션만 숨겨 한 장에 담는다 (앱 파일은 그대로)
  document.getElementById('frame').addEventListener('load', function(){
    try{
      var d = this.contentDocument;
      var s = d.createElement('style');
      s.textContent = '#fabWrite{display:none!important} body::after{content:none!important}';
      d.head.appendChild(s);
    }catch(e){}
  });
</script>
</body>
</html>
