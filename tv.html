<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메종플러스 대형 TV 상담 쇼룸 · 스탠다드 자재 컬렉션</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #090d16;
      --surface: rgba(15, 23, 42, 0.85);
      --text: #ffffff;
      --text-sub: #94a3b8;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg); color: var(--text); }

    /* Main Showroom Viewport */
    .tv-container {
      width: 100vw; height: 100vh; display: flex; flex-direction: column;
      position: relative; justify-content: space-between;
    }

    /* Top Nav Bar */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 36px; z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .brand-badge { background: #2563eb; color: white; font-weight: 900; font-size: 18px; padding: 6px 14px; border-radius: 8px; }
    .brand-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-sub { font-size: 14px; color: var(--text-sub); }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .cat-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1; padding: 8px 18px; border-radius: 20px; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover { background: #2563eb; color: white; border-color: #2563eb; }
    .btn-fs {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      color: white; padding: 8px 16px; border-radius: 10px; font-size: 14px;
      font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    /* Center Stage (Massive Product Photo) */
    .stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; padding: 20px 80px; overflow: hidden;
    }
    .photo-display {
      max-width: 85%; max-height: 82vh; object-fit: contain;
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.7));
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      background: white; border-radius: 24px; padding: 30px;
    }

    /* Side Nav Arrows */
    .arrow-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; font-size: 32px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; z-index: 30;
      transition: all 0.2s; backdrop-filter: blur(10px);
    }
    .arrow-btn:hover { background: #2563eb; border-color: #2563eb; transform: translateY(-50%) scale(1.08); }
    .arrow-left { left: 30px; }
    .arrow-right { right: 30px; }

    /* Bottom Information HUD */
    .bottom-hud {
      background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0) 100%);
      padding: 30px 48px 28px; z-index: 20;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .hud-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .tag-cat { background: #3b82f6; color: white; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 6px; }
    .tag-grade { background: #fef3c7; color: #92400e; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 6px; }
    .hud-brand { color: var(--text-sub); font-size: 15px; font-weight: 700; }
    .hud-title { font-size: 32px; font-weight: 900; letter-spacing: -0.5px; color: #ffffff; margin-bottom: 8px; }
    .hud-space { font-size: 16px; color: #60a5fa; font-weight: 600; margin-bottom: 10px; }
    
    .hud-comment {
      background: rgba(255,255,255,0.08); border-left: 4px solid #3b82f6;
      padding: 10px 16px; border-radius: 0 10px 10px 0; max-width: 850px;
      font-size: 16px; line-height: 1.5; color: #e2e8f0; font-weight: 600;
    }

    .hud-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    }
    .counter-badge {
      font-size: 24px; font-weight: 900; color: var(--accent);
      background: rgba(0,0,0,0.5); padding: 6px 18px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-toggle-spec {
      background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 20px; border-radius: 10px; font-size: 15px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .btn-toggle-spec:hover { background: #2563eb; }

    /* Slide-up Specs Drawer */
    .specs-drawer {
      position: absolute; right: 40px; bottom: 140px; width: 440px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px; padding: 22px; z-index: 40; backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: none; animation: slideUp 0.25s ease-out;
    }
    .specs-drawer.active { display: block; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .drawer-title { font-size: 17px; font-weight: 800; color: white; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display: flex; justify-content: space-between; }
    .drawer-grid { display: grid; grid-template-columns: 1fr; gap: 10px; font-size: 14px; margin-bottom: 14px; }
    .drawer-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.08); padding-bottom: 6px; }
    .drawer-item span:first-child { color: var(--text-sub); }
    .drawer-item span:last-child { color: white; font-weight: 700; }
    .drawer-point { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fbbf24; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.45; }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-group">
        <div class="brand-badge">M+</div>
        <div>
          <div class="brand-text">메종플러스 실전 자재 쇼룸</div>
          <div class="brand-sub">사무실 대형 모니터 상담 프리젠테이션 모드</div>
        </div>
      </div>

      <nav class="nav-actions">
        <button class="cat-btn active" onclick="filterCat('전체')">전체</button>
        <button class="cat-btn" onclick="filterCat('욕실')">욕실</button>
        <button class="cat-btn" onclick="filterCat('주방')">주방</button>
        <button class="cat-btn" onclick="filterCat('바닥재')">바닥재</button>
        <button class="cat-btn" onclick="filterCat('조명')">조명</button>
        <button class="cat-btn" onclick="filterCat('도어·철물')">도어·철물</button>
        <button class="btn-fs" onclick="toggleFullScreen()">⛶ 전체화면 (F11)</button>
        <a href="catalog.html" class="btn-fs" style="text-decoration:none;">📱 모바일 도감</a>
      </nav>
    </header>

    <!-- Center Stage (Massive Photo) -->
    <main class="stage">
      <button class="arrow-btn arrow-left" onclick="prevItem()">❮</button>
      <img id="mainPhoto" src="" alt="" class="photo-display">
      <button class="arrow-btn arrow-right" onclick="nextItem()">❯</button>
    </main>

    <!-- Bottom HUD -->
    <footer class="bottom-hud">
      <div class="hud-left">
        <div class="hud-meta">
          <span id="matCat" class="tag-cat"></span>
          <span id="matGrade" class="tag-grade"></span>
          <span id="matBrand" class="hud-brand"></span>
        </div>
        <h1 id="matTitle" class="hud-title"></h1>
        <div id="matSpace" class="hud-space"></div>
        <div class="hud-comment">
          <span style="color:#60a5fa; font-weight:800;">💡 소장님 코멘트: </span>
          <span id="matComment"></span>
        </div>
      </div>

      <div class="hud-right">
        <div id="counterBadge" class="counter-badge">1 / 10</div>
        <button class="btn-toggle-spec" onclick="toggleDrawer()">📋 상세 제원 및 주의사항</button>
      </div>
    </footer>

    <!-- Specs Drawer -->
    <div id="specsDrawer" class="specs-drawer">
      <div class="drawer-title">
        <span>상세 시공 제원표</span>
        <button onclick="toggleDrawer()" style="background:none; border:none; color:white; cursor:pointer; font-size:16px;">✕</button>
      </div>
      <div id="drawerGrid" class="drawer-grid"></div>
      <div id="drawerPoint" class="drawer-point"></div>
    </div>
  </div>

    let currentList = [...allMaterials];
    let currentIndex = 0;

    function renderItem() {
      if (currentList.length === 0) return;
      const item = currentList[currentIndex];

      document.getElementById('mainPhoto').src = item.image;
      document.getElementById('matCat').textContent = item.category;
      document.getElementById('matGrade').textContent = item.grade;
      document.getElementById('matBrand').textContent = item.brand;
      document.getElementById('matTitle').textContent = item.name;
      document.getElementById('matSpace').textContent = '📍 추천 적용: ' + item.space;
      document.getElementById('matComment').textContent = item.comment;
      document.getElementById('counterBadge').textContent = `${currentIndex + 1} / ${currentList.length}`;

      // Specs Drawer
      const grid = document.getElementById('drawerGrid');
      grid.innerHTML = '';
      for (const [k, v] of Object.entries(item.specs)) {
        const row = document.createElement('div');
        row.className = 'drawer-item';
        row.innerHTML = `<span>${k}</span><span>${v}</span>`;
        grid.appendChild(row);
      }
      document.getElementById('drawerPoint').innerHTML = `<strong>⚠️ 현장 주의사항:</strong> ${item.point}`;
    }

    function nextItem() {
      currentIndex = (currentIndex + 1) % currentList.length;
      renderItem();
    }

    function prevItem() {
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      renderItem();
    }

    function filterCat(cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === cat);
      });
      if (cat === '전체') {
        currentList = [...allMaterials];
      } else {
        currentList = allMaterials.filter(m => m.category === cat);
      }
      currentIndex = 0;
      renderItem();
    }

    function toggleDrawer() {
      document.getElementById('specsDrawer').classList.toggle('active');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Navigation for TV (Remote / Wireless Keyboard)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        nextItem();
      } else if (e.key === 'ArrowLeft') {
        prevItem();
      } else if (e.key === 's' || e.key === 'S') {
        toggleDrawer();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      }
    });

    renderItem();
  </script>
