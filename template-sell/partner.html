<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>협력업체 현장 가이드</title>

  <!-- 카카오톡 링크 미리보기 (현관 비밀번호는 여기에 절대 적지 않습니다) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="협력업체 현장 가이드 · 출입 정보와 공정표">
  <meta property="og:description" content="현장 주소·출입 방법·공정표·소음 시간을 한 화면에서 확인하세요">
  <meta property="og:image" content="og-partner.png">

  <link rel="manifest" href="manifest-partner.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="협력업체 가이드">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #f59e0b;   /* site.js 의 색상으로 자동 교체 */
      --brand: #1e3a8a;
      --brand-light: #3b82f6;
      --accent-light: #fbbf24;
      --primary: #38bdf8;
      --success: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px 14px 90px;
      line-height: 1.5;
    }

    /* 상단 헤더 */
    .header {
      background: linear-gradient(135deg, var(--brand), #0f172a);
      border: 1px solid var(--brand-light);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .badge-partner {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .site-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .site-sub { font-size: 13px; color: #93c5fd; }

    /* 핵심 출입 및 연락처 정보 (대형 박스) */
    .access-card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .access-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .access-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }
    .access-item.full { grid-column: span 2; text-align: left; padding: 12px 14px; }
    .access-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .access-val { font-size: 18px; font-weight: 800; color: var(--accent-light); letter-spacing: 1px; }
    .access-val.addr { font-size: 14px; color: #fff; font-weight: 700; letter-spacing: 0; }

    /* 창호 스펙 항목 (창 위치별 줄바꿈) */
    .win-spec { background: #1e293b; padding: 10px 12px; border-radius: 6px; margin-top: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.55; }
    .win-spec-title { color: #38bdf8; font-weight: 700; margin-bottom: 6px; }
    .win-spec-row { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .win-spec-row:last-child { border-bottom: none; padding-bottom: 0; }
    .win-spec-row b { color: #fff; }

    /* 현장 작업 수칙 */
    .rule-card {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .rule-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .rule-list { list-style: none; font-size: 12px; color: #cbd5e1; }
    .rule-list li { margin-bottom: 5px; position: relative; padding-left: 14px; }
    .rule-list li::before { content: "•"; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

    /* 타임라인 공정표 */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin: 18px 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-desc { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 6px;
    }
    .schedule-date {
      font-size: 13px;
      font-weight: 800;
      color: var(--primary);
    }
    .schedule-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: #334155;
      color: #f1f5f9;
    }
    .schedule-tag.noise { background: #ef4444; color: #fff; }
    .schedule-tag.ready { background: #10b981; color: #fff; }
    .schedule-work {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .schedule-note {
      font-size: 12px;
      color: var(--text-muted);
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 6px;
      border-left: 3px solid var(--accent);
    }

    /* 공정표 : 리스트 보기 / 달력 보기 */
    .view-toggle {
      display: flex;
      gap: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 12px;
    }
    .view-btn {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 9px;
      padding: 9px 0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .view-btn.active { background: var(--accent); color: #0f172a; box-shadow: 0 2px 8px rgba(245, 158, 11, .3); }
    .view-btn:active { transform: scale(.985); }

    #schedule-list-view[hidden], #schedule-calendar-view[hidden] { display: none; }

    .cal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px 10px;
      margin-bottom: 10px;
    }
    .cal-range {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: -0.2px;
      margin-bottom: 8px;
      padding: 0 2px;
      word-break: keep-all;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-muted); padding: 2px 0 4px; }
    .cal-dow.sat { color: #7dd3fc; }
    .cal-dow.sun { color: #fca5a5; }
    .cal-cell {
      position: relative;
      min-height: 66px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #16233b;
      padding: 4px 3px 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cal-cell:active { opacity: .82; }
    .cal-cell.off { background: #131f36; border-style: dashed; }
    .cal-cell.today { box-shadow: 0 0 0 2px rgba(245, 158, 11, .75); }
    .cal-cell.today::after {
      content: '';
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .cal-day { font-size: 10.5px; font-weight: 800; color: #e2e8f0; line-height: 1.1; letter-spacing: -0.3px; }
    .cal-cell.sat .cal-day { color: #7dd3fc; }
    .cal-cell.sun .cal-day { color: #fca5a5; }
    .cal-chip {
      align-self: flex-start;
      font-size: 7px;
      font-weight: 800;
      line-height: 1.35;
      padding: 0 3px;
      border-radius: 3px;
      background: #334155;
      color: #fff;
      letter-spacing: -0.2px;
    }
    .cal-work {
      font-size: 8.5px;
      font-weight: 700;
      line-height: 1.26;
      letter-spacing: -0.35px;
      word-break: keep-all;
      color: #f1f5f9;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cal-sub {
      display: none;
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.3px;
      word-break: keep-all;
      opacity: .9;
    }
    .cal-off-text { font-size: 8.5px; font-weight: 600; color: #64748b; letter-spacing: -0.3px; }

    /* 조금 넓은 화면(태블릿·PC)에서는 칸을 키우고 설명을 함께 보여 줍니다 */
    @media (min-width: 481px) {
      .cal-cell { min-height: 76px; padding: 6px 6px 5px; }
      .cal-day { font-size: 12px; }
      .cal-chip { font-size: 8.5px; padding: 1px 4px; }
      .cal-work { font-size: 10.5px; -webkit-line-clamp: 2; }
      .cal-sub { display: block; }
      .cal-off-text { font-size: 10px; }
      .cal-dow { font-size: 11px; }
      .cal-range { font-size: 12px; }
      .cal-hint { font-size: 12px; }
    }
    .cal-hint {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-top: 10px;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      word-break: keep-all;
    }

    /* 날짜 상세 패널 */
    .cal-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, .78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 2500;
    }
    .cal-detail-overlay.open { display: flex; }
    .cal-detail-sheet {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 28px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .45);
    }
    .cal-detail-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      padding: 6px;
      cursor: pointer;
    }
    .cal-detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-right: 28px; flex-wrap: wrap; }
    .cal-detail-date { font-size: 13px; font-weight: 800; color: var(--text-muted); }
    .cal-detail-badge { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: rgba(56, 189, 248, .18); color: #7dd3fc; white-space: nowrap; }
    .cal-detail-badge.done { background: rgba(148, 163, 184, .2); color: #cbd5e1; }
    .cal-detail-badge.off { background: rgba(148, 163, 184, .16); color: #94a3b8; }
    .cal-detail-title { font-size: 18px; font-weight: 900; line-height: 1.35; color: #fff; letter-spacing: -0.5px; word-break: keep-all; margin-bottom: 12px; }
    .cal-note {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
      padding: 9px 11px;
      background: #0f172a;
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      margin-bottom: 7px;
      word-break: keep-all;
    }
    .cal-note.warn { color: #fca5a5; background: rgba(239, 68, 68, .12); border-left-color: #ef4444; font-weight: 600; }

    /* 공사 전 현장 사진 */
    .photo-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .photo-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .photo-card-title span { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .photo-card-sub { font-size: 11.5px; color: var(--text-muted); line-height: 1.55; margin-bottom: 10px; word-break: keep-all; }
    .pre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pre-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: #0f172a;
      cursor: pointer;
    }
    .pre-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pre-badge {
      position: absolute;
      left: 5px;
      bottom: 5px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .pre-all { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .pre-all[hidden] { display: none; }
    .pre-all .pre-item { aspect-ratio: 1; }
    .pre-all .pre-badge { font-size: 9.5px; padding: 2px 4px; left: 3px; bottom: 3px; letter-spacing: -0.2px; }
    .pre-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 11px 12px;
      border: 1px solid var(--brand-light);
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .pre-toggle:active { opacity: .85; }
    .pre-hint { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 8px; }

    /* 현장 특이사항 메모 */
    .memo-box {
      background: #0f172a;
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 11px 12px;
      margin-top: 12px;
    }
    .memo-title { font-size: 12.5px; font-weight: 800; color: var(--accent-light); margin-bottom: 4px; }
    .memo-item { font-size: 12px; color: #cbd5e1; line-height: 1.55; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.07); word-break: keep-all; }
    .memo-item:last-child { border-bottom: none; padding-bottom: 0; }
    .memo-item b { display: block; color: #fff; font-size: 12.5px; margin-bottom: 2px; }
    .memo-link {
      display: inline-block;
      margin-top: 5px;
      padding: 3px 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 사진 확대 라이트박스 */
    #pre-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    #pre-lightbox.open { display: flex; }
    #pre-lightbox img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      touch-action: pinch-zoom;
    }
    .lb-close {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      z-index: 3001;
    }
    .lb-close:active { background: rgba(255, 255, 255, 0.3); }
    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 56px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      z-index: 3001;
    }
    .lb-nav:active { background: rgba(255, 255, 255, 0.28); }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }
    .lb-caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 60px 18px 16px;
      background: linear-gradient(to top, rgba(2, 6, 23, 0.95), rgba(2, 6, 23, 0));
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      z-index: 3001;
      pointer-events: none;
    }
    .lb-count { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }

    /* 하단 고정 바 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #090d16;
      border-top: 1px solid #334155;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
    }
    .bottom-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-call { background: #10b981; color: #fff; }
    .btn-copy { background: #38bdf8; color: #0f172a; }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 2000;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    /* 판매용 템플릿 추가 */
    .call-chip { background: var(--brand-light); color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .access-item.copyable { cursor: pointer; }
    .nowrap { white-space: nowrap; }
    .brand-footer { text-align: center; font-size: 11px; color: #64748b; padding: 16px 0 0; line-height: 1.6; }

  </style>
</head>
<body data-page="partner">
  <!-- 이 파일은 고치지 않습니다. 내용은 site.js·data.js 에서 바꿉니다. -->
  <div class="header">
    <div class="badge-partner">협력업체 · 시공팀 전용 가이드</div>
    <div class="site-title" data-site="name"></div>
    <div class="site-sub" id="partner-sub"></div>
  </div>

  <div class="access-card">
    <div class="card-label">🔑 현장 출입 및 연락 정보</div>
    <div class="access-grid" id="access-grid"></div>
  </div>

  <div class="rule-card">
    <div class="rule-title">⚠️ 현장 필수 작업 수칙 (관리소 준수)</div>
    <ul class="rule-list" id="rule-list"></ul>
  </div>

  <div class="photo-card" id="pre-card">
    <div class="photo-card-title">📸 공사 전 현장 사진 <span>(착공 전 참고)</span></div>
    <div class="photo-card-sub">착공 전 원상태 기록입니다. 대표 사진으로 공간 상태를 먼저 확인하시고, 전체는 아래 버튼으로 펼쳐 보세요.</div>
    <div class="pre-grid" id="pre-grid"></div>
    <div id="pre-notices"></div>
    <button class="pre-toggle" id="pre-toggle" onclick="togglePreGallery()">전체 사진 펼쳐보기</button>
    <div class="pre-all" id="pre-all" hidden></div>
    <div class="pre-hint" id="pre-hint"></div>
  </div>

  <div class="section-title">
    📅 공정별 일정표
    <span class="section-desc">대표 공지 기준 업데이트</span>
  </div>
  <div class="view-toggle" role="group" aria-label="공정표 보기 방식">
    <button type="button" id="view-btn-list" class="view-btn active" onclick="setScheduleView('list')" aria-pressed="true">📋 리스트 보기</button>
    <button type="button" id="view-btn-calendar" class="view-btn" onclick="setScheduleView('calendar')" aria-pressed="false">📅 달력 보기</button>
  </div>
  <div id="schedule-list-view">
    <div id="partner-schedule"></div>
  </div>
  <div id="schedule-calendar-view" hidden>
    <div class="cal-card">
      <div class="cal-range">
        <span data-site="calRange"></span>
        <span data-site="calTotal"></span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-hint">날짜 칸을 톡 누르면 그날의 공정 내용과 현장 주의사항이 크게 표시됩니다.<br>빨간 칸은 소음 주의 공정, 금색 칸은 완공일, 점선 칸은 휴무입니다.</div>
    </div>
  </div>

  <div class="brand-footer" id="brand-footer"></div>

  <div class="bottom-bar">
    <a href="#" id="call-btn" class="bottom-btn btn-call">📞 대표 통화</a>
    <button class="bottom-btn btn-copy" id="copy-btn" onclick="copyAccessInfo()">📋 현장 정보 복사</button>
  </div>
  <div id="toast" class="toast"></div>

  <div id="cal-detail" class="cal-detail-overlay" onclick="if(event.target.id==='cal-detail')closeCalDetail()">
    <div class="cal-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="cal-detail-date">
      <button type="button" class="cal-detail-close" onclick="closeCalDetail()" aria-label="닫기">✕</button>
      <div class="cal-detail-head">
        <div class="cal-detail-date" id="cal-detail-date"></div>
        <span class="cal-detail-badge" id="cal-detail-badge"></span>
      </div>
      <div class="cal-detail-title" id="cal-detail-title"></div>
      <div id="cal-detail-notes"></div>
    </div>
  </div>

  <div id="pre-lightbox" onclick="if(event.target.id==='pre-lightbox')closePreLightbox()">
    <button class="lb-close" onclick="closePreLightbox()" aria-label="닫기">✕</button>
    <button class="lb-nav lb-prev" onclick="event.stopPropagation();stepPrePhoto(-1)" aria-label="이전 사진">‹</button>
    <img id="pre-lb-img" src="" alt="" onclick="event.stopPropagation()">
    <button class="lb-nav lb-next" onclick="event.stopPropagation();stepPrePhoto(1)" aria-label="다음 사진">›</button>
    <div class="lb-caption">
      <div id="pre-lb-caption"></div>
      <div id="pre-lb-count" class="lb-count"></div>
    </div>
  </div>

  <script src="site.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
