<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390px 검증용 임시 페이지</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;font:12px/1.5 -apple-system,sans-serif;color:#333}
  .bar{padding:4px 10px;font-weight:700;background:#d9d9d9}
  #tall{display:block;border:0;background:#fff;margin:0;width:390px;height:3000px}
</style>
</head>
<body>
<div class="bar" id="bar">390px</div>
<iframe id="tall" src="./diary.html?v=chk"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var h = parseInt(q.get('h') || '3000', 10);
  var f = document.getElementById('tall');
  f.style.height = h + 'px';
  if (q.get('v')) f.src = './diary.html?v=' + encodeURIComponent(q.get('v'));
  document.getElementById('bar').textContent = '390px 폭 · 높이 ' + h + 'px · ' + new Date().toLocaleTimeString('ko-KR');
</script>
</body>
</html>
