<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모바일 미리보기 (검증용)</title>
  <style>
    body { margin: 0; background: #334155; font-family: sans-serif; }
    .frame { width: 390px; background: #fff; margin: 0; }
    iframe { width: 390px; height: 2600px; border: 0; display: block; }
  </style>
</head>
<body>
  <div class="frame"><iframe id="f" src="index.html?v=hanbit_spec"></iframe></div>
  <script>
    var f = document.getElementById('f');
    f.addEventListener('load', function () {
      try {
        var d = f.contentDocument;
        d.querySelectorAll('.nav-tab')[1].click();
        var ab = d.querySelector('.admin-bar');
        if (ab) ab.style.display = 'none';
        d.body.style.paddingBottom = '20px';
      } catch (e) {}
    });
  </script>
</body>
</html>
